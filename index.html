* **Lỗi Wifi:** Kiểm tra Wifi 2.4GHz (không dùng 5GHz), tên Wifi không dùng ký tự đặc biệt, tắt *Trợ lý WLAN* trên điện thoại.
* **Bảo hành:** 36 tháng kể từ ngày mua. Hotline Toshiba: **1800 1529**.`},{id:`k73`,title:`Cảnh báo An toàn về Điện & Dây nguồn Tủ lạnh GR-RF611WI-PGV`,keywords:[`an toan dien`,`dien giat`,`day nguon`,`o cam`,`phich cam`,`rut phich cam`,`GR-RF611WI-PGV`],answer:`### ⚠️ CẢNH BÁO AN TOÀN VỀ ĐIỆN
---
* **Phích cắm & Ổ cắm:** Sử dụng ổ cắm chuyên dụng, cắm chặt phích cắm, không dùng chung ổ cắm với thiết bị khác để tránh quá nhiệt gây hỏa hoạn.
* **Thao tác rút cắm:** Khi rút phích cắm, nắm chặt thân phích rút trực tiếp, tuyệt đối không kéo lê dây điện.
* **Nối đất an toàn:** Yêu cầu ổ cắm phải có dây nối đất đáng tin cậy. Rút điện trước khi vệ sinh, bảo dưỡng hoặc ngắt kết nối thiết bị.
* **Dây điện hỏng:** Tuyệt đối không tự ý thay dây nguồn hỏng, phải do nhà sản xuất hoặc KTV chuyên môn thay thế.`},{id:`k74`,title:`Cảnh báo An toàn về Chống cháy nổ & Gas lạnh GR-RF611WI-PGV`,keywords:[`chong chay no`,`gas lanh`,`cyclopentane`,`vat lieu de chay`,`ro ri gas`,`r290`,`r600a`,`GR-RF611WI-PGV`],answer:`### 🔥 CẢNH BÁO CHỐNG CHÁY NỔ & GAS LẠNH
---
* **Môi chất lạnh:** Tủ sử dụng Gas lạnh và chất cách nhiệt Cyclopentane dễ cháy. Khi hủy bỏ phải đưa đến điểm thu gom chuyên dụng, không thải bỏ chung với rác thải sinh hoạt hay nguồn lửa.
* **Vật liệu cấm để trong tủ:** Cấm đặt chai lọ chứa cồn, xăng, dầu hỏa, dung môi, cồn ethyl hoặc thực phẩm chứa chất này vào tủ (nguy cơ nổ).
* **Vật liệu cấm để gần tủ:** Không đặt nến, thuốc lá đang cháy hay chất dễ cháy gần tủ lạnh.
* **Xử lý khi rò rỉ Gas:** Khóa van gas ngay, mở tất cả cửa sổ/cửa chính cho thông thoáng. **Tuyệt đối không** rút/cắm phích điện hay bật tắt thiết bị điện vì tia lửa điện sẽ gây cháy nổ.`},{id:`k75`,title:`Cảnh báo An toàn Trẻ em & Môi trường sử dụng GR-RF611WI-PGV`,keywords:[`an toan tre em`,`tre em chui vao tu`,`nguy co ngat tho`,`moi truong su dung`,`GR-RF611WI-PGV`],answer:`### 🚸 AN TOÀN TRẺ EM & MÔI TRƯỜNG SỬ DỤNG
---
* **An toàn trẻ em:** Trẻ em không được trèo, chui hay chơi đùa bên trong/bên ngoài tủ. Giữ vỏ bao bì, nilon xa tầm tay trẻ để tránh nguy cơ ngạt thở.
* **Khi thải bỏ tủ cũ:** Tháo rời toàn bộ cửa tủ và gioăng cửa, để kệ ở vị trí cố định để trẻ không thể chui vào bên trong bị kẹt.
* **Môi trường sử dụng:** Chỉ dùng trong gia đình (trong nhà). Không sử dụng trên các phương tiện giao thông (như tàu thủy, xe lưu động). Không cắm điện tủ lạnh ở nơi ẩm ướt, dột nước hay ngoài trời.`},{id:`k76`,title:`Mô tả Các bộ phận & Khay kệ bên trong Tủ lạnh GR-RF611WI-PGV`,keywords:[`cau tao tu lanh`,`cac bo phan`,`ngan mat`,`ngan dong`,`ngan linh hoat`,`den led`,`khay kinh`,`GR-RF611WI-PGV`],answer:`### 🧊 CẤU TẠO BỘ PHẬN TỦ LẠNH Multi Door
---
* **Ngăn mát (Phía trên):** Đèn LED chiếu sáng, các khay kính chịu lực (chỉnh nâng hạ), khay đựng cửa tủ, ngăn kéo lưu trữ.
* **Ngăn chứa linh hoạt (Flexible Zone):** Ngăn kéo riêng biệt tùy chỉnh đa dạng nhu cầu (Rau củ, Đồ uống, Ướp lạnh).
* **Ngăn đông (Phía dưới):** Hệ thống khay kéo gồm ngăn kéo trên, ngăn kéo giữa và ngăn kéo dưới giúp phân loại thịt cá dễ dàng.`},{id:`k77`,title:`Lưu ý Lắp đặt & Kích thước khoảng cách kê tủ GR-RF611WI-PGV`,keywords:[`lap dat tu lanh`,`khoang cach ke tu`,`toa nhiệt`,`can bang chan tu`,`chieu cao`,`chieu rong`,`GR-RF611WI-PGV`],answer:`### 📐 LẮP ĐẶT & KHOẢNG CÁCH THÔNG THOÁNG
---
* **Khoảng cách tản nhiệt:** Phía trên đỉnh tủ phải cách trần **> 30cm**; Mặt sau cách tường **> 10cm**; Hai bên hông tủ cách tường **> 10cm** để đảm bảo máy tản nhiệt tốt, tiết kiệm điện.
* **Vị trí đặt tủ:** Đặt trên sàn nhà bằng phẳng, chắc chắn. Tránh ánh nắng mặt trời chiếu trực tiếp và xa các nguồn nhiệt (bếp gas, lò sưởi).
* **Cân bằng chân tủ:** Xoay chân điều chỉnh phía trước theo chiều kim đồng hồ để nâng cao tủ, xoay ngược chiều kim đồng hồ để hạ thấp tủ.`},{id:`k78`,title:`Bảng điều khiển & Màn hình hiển thị Tủ lạnh GR-RF611WI-PGV`,keywords:[`bang dieu khien`,`man hinh hien thi`,`khoa va mo khoa`,`khoa phim`,`mo khoa phim`,`GR-RF611WI-PGV`],answer:`### 🎛️ BẢNG ĐIỀU KHIỂN & KHÓA AN TOÀN
---
* **Trạng thái màn hình:** Khi đóng cửa và không thao tác trong 30 giây, màn hình sẽ tự động khóa và tắt đèn để tiết kiệm điện. Đèn sáng lại khi mở cửa hoặc bấm phím bất kỳ.
* **Mở khóa bảng điều khiển (Lock/Unlock):** Ở trạng thái khóa, nhấn giữ nút **[ Khóa/Mở khóa 🔒 ]** trong **3 giây** cho đến khi phát ra tiếng "bíp" để mở khóa.
* **Khóa bảng điều khiển:** Ở trạng thái mở khóa, nhấn giữ nút **[ Khóa/Mở khóa 🔒 ]** trong **3 giây** để khóa màn hình.`},{id:`k79`,title:`Cài đặt Nhiệt độ Ngăn mát (Fridge) GR-RF611WI-PGV`,keywords:[`cai dat nhiet do ngan mat`,`chinh nhiet do ngan mat`,`do c ngan mat`,`nhiet do ngan mat`,`GR-RF611WI-PGV`],answer:`### 🌡️ CÀI ĐẶT NHIỆT ĐỘ NGĂN MÁT
---
* **Thao tác:** Ở trạng thái mở khóa màn hình, nhấn nút **[ Ngăn mát ]** để thay đổi nhiệt độ.
* **Phạm vi nhiệt độ:** Cho phép cài đặt từ **2°C đến 8°C**.
* **Quy trình nhảy số:** Mỗi lần nhấn nút, nhiệt độ sẽ giảm **1°C**. Khi giảm xuống \`2°C\`, nhấn tiếp một lần nữa nhiệt độ sẽ quay trở lại **8°C**.
* **Xác nhận:** Sau khi chọn mức mong muốn, không thao tác trong vài giây đến khi màn hình bị khóa, nhiệt độ mới sẽ có hiệu lực.`},{id:`k80`,title:`Cài đặt Nhiệt độ Ngăn đông (Freezer) GR-RF611WI-PGV`,keywords:[`cai dat nhiet do ngan dong`,`chinh nhiet do ngan dong`,`do c ngan dong`,`nhiet do ngan am`,`GR-RF611WI-PGV`],answer:`### ❄️ CÀI ĐẶT NHIỆT ĐỘ NGĂN ĐÔNG
---
* **Thao tác:** Ở trạng thái mở khóa màn hình, nhấn nút **[ Ngăn đông ]** để chỉnh nhiệt độ.
* **Phạm vi nhiệt độ:** Cho phép cài đặt từ **-16°C đến -24°C**.
* **Quy trình nhảy số:** Mỗi lần nhấn nút, nhiệt độ sẽ giảm **1°C**. Khi giảm xuống \`-24°C\`, nhấn tiếp một lần nữa nhiệt độ sẽ quay trở lại **-16°C**.
* **Xác nhận:** Sau khi chọn mức mong muốn, chờ màn hình tự khóa để lưu thiết lập.`},{id:`k81`,title:`Cài đặt Ngăn chứa linh hoạt (Flexible Zone) GR-RF611WI-PGV`,keywords:[`ngan linh hoat`,`flexible zone`,`chinh ngan linh hoat`,`trai cay va rau cu`,`do uong lanh`,`uop lanh`,`GR-RF611WI-PGV`],answer:`### 🔄 CÀI ĐẶT NGĂN CHỨA LINH HOẠT
---
* **Thao tác:** Nhấn nút **[ Ngăn chứa linh hoạt ]** để chuyển đổi giữa 3 chế độ bảo quản đặc biệt:
* **1. Trái cây & Rau củ (Fruit & Veg):** Đèn biểu tượng tương ứng sáng lên, tối ưu độ ẩm bảo quản rau củ tươi ngon.
* **2. Đồ uống lạnh (Drink):** Đèn biểu tượng sáng, làm lạnh nhanh các loại nước giải khát, lon bia, nước ngọt.
* **3. Ướp lạnh (Soft Freeze / Chill):** Đèn biểu tượng sáng, thích hợp lưu trữ thịt cá dùng trong ngày không cần rã đông.`},{id:`k82`,title:`Chế độ Làm lạnh sâu & Làm đông sâu GR-RF611WI-PGV`,keywords:[`lam lanh sau`,`lam dong sau`,`super cooling`,`super freezing`,`cap dong nhanh`,`GR-RF611WI-PGV`],answer:`### ⚡ CHẾ ĐỘ LÀM LẠNH SÂU & LÀM ĐÔNG SÂU
---
* **Chế độ Làm lạnh sâu (Super Cooling):** Tự động cài đặt ngăn mát về **2°C**. Thích hợp khi cần làm lạnh nhanh khối lượng lớn thực phẩm mới cho vào. Đèn biểu tượng sáng khi kích hoạt.
* **Chế độ Làm đông sâu (Super Freezing):** Tự động cài đặt ngăn đông về **-24°C**. Thích hợp cấp đông nhanh thịt cá tươi sống để giữ trọn dưỡng chất. Đèn biểu tượng sáng khi kích hoạt.
* **Thoát chế độ:** Khi hết chu kỳ tự động hoặc khi chọn lại nhiệt độ thủ công, tủ sẽ tự thoát chế độ và trở về nhiệt độ cài đặt trước đó.`},{id:`k83`,title:`Chế độ Kỳ nghỉ (Vacation Mode) GR-RF611WI-PGV`,keywords:[`che do ky nghi`,`vacation mode`,`di du lich`,`vang nha`,`tiet kiem dien ky nghi`,`GR-RF611WI-PGV`],answer:`### ✈️ CHẾ ĐỘ KỲ NGHĨA (VACATION MODE)
---
* **Công dụng:** Dùng khi gia đình đi du lịch hoặc vắng nhà trong thời gian dài không sử dụng ngăn mát.
* **Trạng thái tủ:** Chức năng làm lạnh ngăn mát sẽ tắt, biểu tượng **[ Vacation ✈️ ]** sáng lên. Ngăn đông vẫn hoạt động bình thường để bảo quản thực phẩm đông lạnh.
* **Lưu ý quan trọng:** *Phải lấy hết toàn bộ thực phẩm ra khỏi ngăn mát* trước khi bật chế độ Kỳ nghỉ để tránh hư hỏng bốc mùi.`},{id:`k84`,title:`Mẹo Bảo quản Thực phẩm đúng cách GR-RF611WI-PGV`,keywords:[`bao quan thuc pham`,`meo de do trong tu lanh`,`boc thuc pham`,`ngan mat`,`ngan dong`,`GR-RF611WI-PGV`],answer:`### 🥗 MẸO BẢO QUẢN THỰC PHẨM ĐÚNG CÁCH
---
* **Sơ chế & Đóng gói:** Nên bọc kín hoặc cho thực phẩm vào hộp đậy nắp trước khi cất vào tủ để tránh mất nước và lẫn mùi.
* **Thức ăn nóng:** Phải để thức ăn nóng nguội hoàn toàn về nhiệt độ phòng mới được cho vào tủ lạnh.
* **Ngăn mát:** Phù hợp lưu trữ rau củ, trái cây, thức ăn chín, đồ uống (thời hạn dùng ngắn 1-3 ngày).
* **Ngăn đông:** Phù hợp bảo quản thịt, cá, hải sản tươi sống đông lạnh dài hạn và làm đá viên.
* **Lưu ý không gian:** Không xếp thực phẩm quá chật che kín các khe hở thổi gió lạnh.`},{id:`k85`,title:`Sử dụng Khay đá xoay & Hộp trữ đá GR-RF611WI-PGV`,keywords:[`khay lam da`,`khay da xoay`,`hop tru da`,`lay da vien`,`cach lam da`,`GR-RF611WI-PGV`],answer:`### 🧊 HƯỚNG DẪN SỬ DỤNG KHAY LÀM ĐÁ
---
* **Cách làm đá:** Đổ nước sạch vào các ô của khay làm đá, không đổ quá đầy tràn vách ngăn. Đặt khay vào vị trí ngăn đông.
* **Cách lấy đá:** Khi đá đã đông cứng, xoay núm vặn trên khay đá theo chiều kim đồng hồ, đá viên sẽ tự động rớt xuống hộp trữ đá bên dưới.
* **Rút hộp đá:** Rút nhẹ hộp trữ đá ra để lấy đá viên sử dụng.`},{id:`k86`,title:`Hướng dẫn Vệ sinh & Bảo dưỡng Tủ lạnh GR-RF611WI-PGV`,keywords:[`ve sinh tu lanh`,`bao duong tu lanh`,`lau tu lanh`,`baking soda`,`ve sinh gioang cua`,`GR-RF611WI-PGV`],answer:`### 🧽 HƯỚNG DẪN VỆ SINH TỦ LẠNH
---
* **Chuẩn bị:** Rút phích cắm điện và lấy toàn bộ thực phẩm ra ngoài trước khi vệ sinh.
* **Dung dịch lau chùi:** Dùng khăn mềm thấm nước ấm pha với ít bột baking soda (khoảng 2 thìa baking soda với 1 lít nước ấm) để lau lòng tủ. Sau đó lau lại bằng khăn sạch khô.
* **Vệ sinh gioăng cửa:** Lau gioăng cao su cửa thường xuyên bằng nước xà phòng pha loãng để tránh bám bẩn gây hở cửa.
* **Cấm sử dụng:** Không dùng bàn chải cứng, búi sắt, chất tẩy rửa ăn mòn, xăng, benzene, dung môi hay nước sôi để vệ sinh tủ. Không xịt nước trực tiếp lên tủ.`},{id:`k87`,title:`Chức năng Xả đông tự động (Defrost) GR-RF611WI-PGV`,keywords:[`xa dong tu dong`,`xa tuyet`,`dong tuyet tu lanh`,`no frost`,`GR-RF611WI-PGV`],answer:`### ❄️ CHỨC NĂNG XẢ ĐÔNG TỰ ĐỘNG
---
* **Nguyên lý:** Tủ lạnh được thiết kế theo cơ chế làm mát bằng quạt gió (No Frost) nên có chức năng tự động xả đông/xả tuyết định kỳ.
* **Thao tác thủ công:** Người dùng không cần phải cạo tuyết thủ công.
* **Lưu ý:** Nếu thấy sương/tuyết bám do độ ẩm thời tiết giao mùa hoặc mở cửa nhiều, bạn chỉ cần ngắt điện tủ và dùng khăn khô lau sạch. Tuyệt đối không dùng vật sắc nhọn để cạy tuyết.`},{id:`k88`,title:`Hướng dẫn xử lý Khi Tủ lạnh không hoạt động/ Mất điện GR-RF611WI-PGV`,keywords:[`mat dien`,`khi mat dien`,`khong hoat dong trong thoi gian dai`,`di chuyen tu lanh`,`GR-RF611WI-PGV`],answer:`### 🔌 XỬ LÝ KHI MẤT ĐIỆN & NGHỈ SỬ DỤNG DÀI NGHÀY
---
* **Khi mất điện đột ngột:** Hạn chế tối đa số lần mở cửa tủ để giữ hơi lạnh. Không cho thêm thực phẩm tươi mới vào tủ trong lúc mất điện. Thực phẩm có thể giữ lạnh an toàn trong vài giờ.
* **Khi không dùng thời gian dài:** Rút phích cắm điện, lấy hết thực phẩm, vệ sinh sạch sẽ bên trong và **để hở cửa tủ** để tránh phát sinh nấm mốc, mùi hôi.
* **Khi di chuyển tủ:** Rút điện, lấy hết đồ, dùng băng dính cố định các khay kệ kính, vặn cao chân đế, đóng chặt cửa. Góc nghiêng khi di chuyển **không vượt quá 45°**, không lật ngược tủ. Sau khi di chuyển đến vị trí mới, nên để tủ đứng yên **2-4 tiếng** rồi mới cắm điện lại.`},{id:`k89`,title:`Xử lý Sự cố: Tủ không hoạt động hoặc Có mùi hôi GR-RF611WI-PGV`,keywords:[`tu khong chay`,`tu khong len dien`,`co mui hoi`,`tu bi mui`,`khac phuc loi tu lanh`,`GR-RF611WI-PGV`],answer:`### 🛠️ XỬ LÝ SỰ CỐ: TỦ KHÔNG CHẠY / CÓ MÙI HÔI
---
* **Tủ không hoạt động:** Kiểm tra phích cắm đã cắm chặt chưa; kiểm tra nguồn điện nhà hoặc cầu dao có bị nhảy không; điện áp có quá thấp không.
* **Tủ có mùi hôi:** Kiểm tra thực phẩm bọc kín chưa, có đồ nào bị hỏng không. Tiến hành vệ sinh lòng tủ bằng nước ấm pha baking soda.
* **Máy nén chạy liên tục:** Bình thường vào mùa hè nhiệt độ môi trường cao, hoặc do bỏ quá nhiều thực phẩm cùng lúc, hoặc do mở cửa quá thường xuyên.`},{id:`k90`,title:`Xử lý Sự cố: Cửa không đóng kín & Gioăng cửa bị hở GR-RF611WI-PGV`,keywords:[`cua khong dong duoc`,`gioang cua bi ho`,`ron cua bi hơ`,`phuc hoi gioang cua`,`GR-RF611WI-PGV`],answer:`### 🛠️ XỬ LÝ SỰ CỐ: CỬA TỦ & GIOĂNG CỬA HỞ
---
* **Cửa tủ không đóng kín:** Kiểm tra xem túi thực phẩm hay khay đồ có bị cản trở hành trình đóng cửa không; kiểm tra tủ có bị đặt nghiêng lệch không (chỉnh lại chân đế cân bằng).
* **Gioăng (ron) cửa bị hở/bẩn:** Lau sạch vết bẩn bám trên gioăng cao su.
* **Phục hồi gioăng bị biến dạng:** Dùng máy sấy tóc sấy nóng nhẹ vùng gioăng bị méo hoặc dùng khăn nóng ủ lên gioăng để cao su mềm ra và khôi phục lại độ bám dính.`},{id:`k91`,title:`Xử lý Hiện tượng Thường gặp (Không phải lỗi) GR-RF611WI-PGV`,keywords:[`tu lanh bi nong`,`nong 2 ben hong`,`tieng keu keu`,`dong nuoc ngoai tu`,`tieng gas chay`,`GR-RF611WI-PGV`],answer:`### 🔊 BÌNH THƯỜNG HAY LỖI KỸ THUẬT?
---
* **Vỏ tủ bị nóng (Hai bên hông tủ nóng):** Đây là hiện tượng **HOÀN TOÀN BÌNH THƯỜNG** do dàn nóng tản nhiệt tích hợp hai bên hông tủ.
* **Đọng sương bên ngoài tủ:** Khi độ ẩm không khí môi trường quá cao (ngày nồm, mưa ẩm), sương có thể đọng bề mặt ngoài hoặc gioăng cửa. Chỉ cần dùng khăn sạch lau khô.
* **Tiếng ồn róc rách/róc rách:** Do môi chất lạnh (Gas) luân chuyển bên trong đường ống tạo ra (Bình thường).
* **Tiếng kêu rung khi bắt đầu/dừng:** Do máy nén (Block) khởi động hoặc ngắt nhịp (Bình thường).`},{id:`k92`,title:`Thông số Kỹ thuật chi tiết Tủ lạnh GR-RF611WI-PGV`,keywords:[`thong so ky thuat tu lanh`,`kich thuoc tu lanh`,`dung tich tu lanh`,`khoi luong tu lanh`,`cong suat tu lanh`,`GR-RF611WI-PGV`],answer:`### 📏 THÔNG SỐ KỸ THUẬT TỦ LẠNH GR-RF611WI-PGV
---
📌 **1. KÍCH THƯỚC & TRỌNG LƯỢNG:**
* **Kiểu dáng:** Multi Door (4 cửa).
* **Chiều Rộng x Chiều Sâu x Chiều Cao:** 833 mm x 648 mm x 1898 mm.

⚡ **2. THÔNG SỐ VẬN HÀNH:**
* **Điện áp định mức:** 220V - 240V / 50Hz.
* **Môi chất lạnh (Gas):** R600a / Cyclopentane.
* **Công nghệ:** Inverter tiết kiệm điện, Xả đông tự động (No Frost).
* **Hệ thống điều khiển:** Màn hình cảm ứng bên ngoài tủ.`},{id:`k93`,title:`Hướng dẫn & Trợ giúp chung cho Tổng đài viên`,keywords:[`giup toi`,`toi can giup`,`giup`,`help`,`ho tro`,`tro giup`,`can ho tro`,`huong dan su dung bot`,`menu`,`bat dau`],answer:"### 🤖 TRỢ LÝ TRA CỨU HỖ TRỢ TỔNG ĐÀI\n---\nBạn có thể tra cứu nhanh thông tin bằng các cú pháp sau:\n\n* **1. Tra cứu Mã lỗi:** Gõ trực tiếp mã lỗi (VD: `E1`, `E3`, `E4`, `E10`, `E21`, `E95`...).\n* **2. Tra cứu theo Model máy:** Gõ model (VD: `DW-15F9`, `DW-15F8`, `DW-15F7`, `RF611`...).\n* **3. Tra cứu theo Tính năng:** Gõ tên chức năng (VD: `khi nong`, `bao quan`, `tu he cua`, `go mo cua`, `ve sinh bo loc`, `khoa tre em`...).\n* **4. Tra cứu Sách HDSD & Sơ đồ:** Gõ `HDSD` hoặc chọn ngành hàng để lọc tài liệu PDF."},{id:`k94`,title:`Hướng dẫn Quy trình Xử lý khi Khách báo Mã lỗi`,keywords:[`khach bao loi`,`quy trinh bao loi`,`huong dan khach xu ly loi`,`khach bao ma loi`,`cach xu ly khi gap ma loi`],answer:`### 🎧 QUY TRÌNH HỖ TRỢ KHÁCH BÁO MÃ LỖI
---
📌 **3 BƯỚC XỬ LÝ NHANH:**
* **Bước 1 (Xác nhận):** Hỏi khách hàng Model máy chính xác và Mã lỗi đang nhấp nháy trên màn hình (hoặc số lần chớp đèn LED).
* **Bước 2 (Tra cứu & Hướng dẫn sơ bộ):** Gõ mã lỗi vào Chatbot để hướng dẫn khách kiểm tra các lỗi cơ bản (như chưa mở van nước, ống xả tắc, phích cắm lỏng, kẹt cửa).
* **Bước 3 (Tiếp nhận Kỹ thuật):** Nếu là lỗi phần cứng bo mạch/cảm biến/bơm, tạo phiếu yêu cầu Kỹ thuật viên đến kiểm tra tận nhà.`},{id:`k95`,title:`Hướng dẫn Tra cứu Thông tin & Chính sách Bảo hành`,keywords:[`chinh sach bao hanh`,`dieu kien bao hanh`,`kiem tra bao hanh`,`thoi han bao hanh`,`bao hanh mien phi`],answer:`### 📋 CHÍNH SÁCH BẢO HÀNH CHÍNH HÃNG TOSHIBA
---
* **Thời hạn tiêu chuẩn:** **36 tháng** tính từ ngày mua (không quá 42 tháng từ ngày xuất kho).
* **Đăng ký bảo hành:** Khách hàng cần đăng ký trong vòng **14 ngày** sau khi mua máy qua website hoặc Zalo Official *Toshiba Lifestyle VN*.
* **Điều kiện miễn phí:** Sản phẩm còn hạn bảo hành, lỗi do linh kiện/nhà sản xuất, tem niêm phong còn nguyên vẹn.
* **Tổng đài tiếp nhận:** **1800 1529** (Miễn phí cước, 8:00 - 20:00 hàng ngày).`},{id:`k96`,title:`Xử lý khi Không tìm thấy Mã lỗi hoặc Không có kết quả`,keywords:[`khong tim thay`,`khong co ket qua`,`ma loi la`,`khong co trong he thong`,`khong ra ket qua`],answer:"### 🔍 MẸO TÌM KIẾM KHI KHÔNG RA KẾT QUẢ\n---\n* **Rút gọn từ khóa:** Chỉ gõ ký tự cốt lõi (VD: thay vì gõ `máy rửa bát bị tràn nước` hãy gõ `E4` hoặc `tran nuoc`).\n* **Kiểm tra bộ lọc Model:** Bấm nút **[ 🌐 Tất cả ]** trên thanh lọc Model để mở rộng phạm vi tìm kiếm toàn bộ hệ thống.\n* **Tìm theo danh mục:** Gõ `tro giup tung buoc` để duyệt thủ công theo Ngành hàng ➔ Loại thiết bị ➔ Danh sách tài liệu."},{id:`k97`,title:`Hướng dẫn Reset / Khởi động lại thiết bị cơ bản`,keywords:[`reset`,`khoi dong lai may`,`xoa loi tam thoi`,`reset may`,`cach reset`],answer:`### 🔄 HƯỚNG DẪN RESET / XÓA LỖI TẠM THỜI
---
Khi thiết bị bị đơ bảng điều khiển hoặc hiển thị lỗi ảo do xung điện nguồn:

* **Bước 1:** Nhấn nút Nguồn tắt máy.
* **Bước 2:** Rút phích cắm điện nguồn ra khỏi ổ cắm hoàn toàn.
* **Bước 3:** Đợi khoảng **5 - 10 phút** để tụ điện trên bo mạch xả hết điện tích.
* **Bước 4:** Cắm chặt lại phích cắm, bật nguồn và chọn lại chương trình chạy thử.`},{id:`k98`,title:`Kênh Đăng ký Bảo hành & Tra cứu Trực tuyến Toshiba`,keywords:[`zalo toshiba`,`website toshiba`,`kenh bao hanh`,`dang ky bao hanh online`,`link bao hanh`],answer:`### 🌐 CÁC KÊNH LIÊN HỆ & BẢO HÀNH CHÍNH THỨC
---
* **Tổng đài Hotline:** **1800 1529** (Miễn cước cuộc gọi).
* **Zalo Official Account:** Tìm kiếm *Toshiba Lifestyle VN* (Có dấu tích xác thực).
* **Website chính thức:** \`https://www.toshiba-lifestyle.com/vn\`
* **Giờ làm việc tổng đài:** 8h00 đến 20h00 (Từ Thứ Hai đến Chủ Nhật).`},{id:`k99`,title:`Hướng dẫn Tra cứu Sách Hướng Dẫn Sử Dụng (PDF)`,keywords:[`sach hdsd`,`huong dan su dung pdf`,`tai sach hdsd`,`file pdf`,`xem sach hdsd`],answer:"### 📚 TRA CỨU SÁCH HDSD (TÀI LIỆU PDF)\n---\nĐể xem hoặc tải file PDF tài liệu hướng dẫn sử dụng gốc của hãng:\n\n* **Cách 1:** Gõ mã model máy vào ô chat (VD: `TW-BK115`, `DW-15F9`, `GR-RF611`...) và bấm vào nút **[ 📖 SÁCH HDSD ]** xuất hiện bên dưới câu trả lời.\n* **Cách 2:** Bấm vào mục **TRA CỨU SÁCH HDSD (PDF)** màu xanh ở đầu trang chủ để duyệt danh mục theo từng model."},{id:`k100`,title:`Hướng dẫn Đóng góp & Báo cáo Pan bệnh mới`,keywords:[`dong gop pan benh`,`them ma loi moi`,`bao cao pan benh`,`kinh nghiem sua chua`],answer:`### ➕ ĐÓNG GÓP PAN BỆNH & MÃ LỖI MỚI
---
Nếu bạn phát hiện mã lỗi mới hoặc có kinh nghiệm xử lý thực tế từ kỹ thuật viên:

* **Thao tác:** Bấm vào ô **[ + ĐÓNG GÓP PAN BỆNH MỚI ]** trên trang chủ hệ thống.
* **Thông tin cần nhập:** Ngành hàng, Model máy, Hiện tượng, Nguyên nhân thực tế và Cách xử lý chi tiết.
* **Duyệt bài:** Bộ phận kỹ thuật chuyên môn sẽ thẩm định và cập nhật vào kho dữ liệu Chatbot nội bộ.`}],kr=[{id:`washing`,label:`🧺 Máy giặt & Máy sấy`,title:`CHẨN ĐOÁN MÁY GIẶT - MÁY SẤY`,guide:`Khách hàng phản ánh hiện tượng nào sau đây trên máy giặt?`,children:[{id:`w_spin`,label:`1. Máy không vắt (Nước không thoát ra được)`,title:`Khắc phục Máy giặt không vắt do không thoát nước`,result:`👉 **Hướng dẫn khách kiểm tra:**
1. Kiểm tra ống thoát nước có bị gập khúc hoặc nâng quá cao (>1m) không.
2. Vặn nắp bộ lọc bơm xả (ở góc dưới bên phải máy) để làm sạch xơ vải, tiền xu kẹt.
3. Nếu bơm không kêu và không xả nước ➔ Tạo ticket KTV kiểm tra Motor bơm xả.`},{id:`w_vibration`,label:`2. Máy rung lắc mạnh & đập thùng khi vắt`,title:`Khắc phục Máy giặt rung lắc mạnh`,result:`👉 **Hướng dẫn khách kiểm tra:**
1. Kiểm tra 4 chân máy giặt có kê cân bằng trên mặt sàn phẳng không.
2. Đồ giặt bên trong có bị xoắn cục dồn về một phía không (tạm dừng, tơi đồ ra).
3. Đối với máy mới lắp: Đã tháo 4 bu-lông vận chuyển phía sau lưng máy chưa.`},{id:`w_overflow`,label:`3. Máy cấp nước liên tục không ngắt (Tràn nước)`,title:`Khắc phục Lỗi cấp nước liên tục`,result:`👉 **Hướng dẫn khách kiểm tra:**
1. Rút phích cắm điện nếu nước vẫn chảy vào ➔ Hỏng van cấp nước (kẹt cơ).
2. Nếu rút điện nước ngắt ngay ➔ Lỗi cảm biến phao áp lực hoặc bo mạch điều khiển ➔ Báo KTV hỗ trợ.`},{id:`w_door_lock`,label:`4. Máy giặt xong không mở được cửa (Máy cửa ngang)`,title:`Xử lý kẹt cửa máy giặt cửa trước`,result:`👉 **Hướng dẫn xử lý:**
