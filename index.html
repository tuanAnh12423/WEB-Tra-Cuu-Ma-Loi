 GIẶT DƠ`,title:`Máy giặt giặt xong quần áo không sạch`,description:`Sau khi bạn giặt xong, quần áo không sạch. Phần này sẽ hướng dẫn bạn xử lý vấn đề đó.`,steps:[{text:`Hãy chú ý chọn chương trình giặt phù hợp với lượng quần áo cho vào`},{text:`Hãy lấy hết giấy tờ, hoá đơn khỏi các túi áo, túi quần`},{text:`Chú ý bỏ vừa phải lượng đồ, không bỏ quá số ký máy giặt`}],images:[`https://lh3.googleusercontent.com/d/1TyfTWNYVuDlR1cfI6bR_APQSlbOOEGwn`],videoUrls:[]},{id:`W012`,category:`washing`,code:`(WM59) CÒN NƯỚC TRONG LỒNG GIẶT (Máy giặt cửa trên)`,title:`Máy giặt giặt xong vẫn còn nước trong lồng giặt ở máy giặt cửa trên`,description:`Sau khi hoàn tất chu trình giặt, bạn phát hiện còn nước trong lồng giặt, máy không xả ra hết. Phần này sẽ hướng dẫn bạn cách xử lý`,steps:[{text:`Kiểm tra ống xả có đang treo lên hay không. Phải thả ống xả xuống đất đối với máy cửa trên`,images:[`https://lh3.googleusercontent.com/d/1WtO2CcFOlGRuMVsd7xwEViNLSDLoHdG8`]}],images:[],videoUrls:[]},{id:`W013`,category:`washing`,code:`(WM61) MÁY GIẶT KHÔNG GIẶT (Máy giặt cửa trước)`,title:`Máy giặt cửa trước có nguồn nhưng không giặt`,description:`Bạn mở máy lên bấm giặt máy giảm thời gian, nhưng không giặt, không thấy nước cấp hoặc nước cấp vào rất yếu`,steps:[{text:`Kiểm tra van khoá nước cấp của máy. Nếu van bị khoá cần mở ra`},{text:`Kiểm tra ổ điện cắm máy, nếu ổ điện kém chất lượng cần thay thế và thử lại chương trình khác`},{text:`Nếu sử dụng máy được một thời gian cần vệ sinh bộ lọc van cấp`},{text:`Mẹo: Hãy thử chương trình chỉ vắt => Nếu máy vẫn vắt bình thường hãy kiểm tra lại nguồn nước của bạn.`}],images:[`https://lh3.googleusercontent.com/d/14sWU6WV8ItvLxf-ebop9q4bX8UMIWyCz`,`https://lh3.googleusercontent.com/d/1wm2MThJLQqFllCJRitltj7xT1LK7ygsW`,`https://lh3.googleusercontent.com/d/17N3mSG5_dGn_Tu_eNMrR2tFa10S9jFYj`],videoUrls:[]},{id:`W014`,category:`washing`,code:`(WM53) KHÔNG HOÀN TẤT CHU TRÌNH GIẶT, TĂNG THỜI GIAN GIẶT, GIẶT LÂU`,title:`Máy giặt không hoàn tất được chu trình giặt, hoặc bị tăng thời gian giặt`,description:`Bạn bắt đầu chương trình giặt sau khi gần kết thúc máy tự tăng thời gian, hoặc không hoàn tất chu trình giặt`,steps:[{text:`Nguồn nước cấp cho máy quá yếu. Thử vệ sinh bộ lọc van cấp nếu sử dụng máy một thời gian dài`},{text:`Kiểm tra ống xả nước của máy. Chỉnh lại ống xả hoặc vệ sinh nếu ống xả bị tắc hoặc gấp khúc`}],images:[`https://lh3.googleusercontent.com/d/14sWU6WV8ItvLxf-ebop9q4bX8UMIWyCz`,`https://lh3.googleusercontent.com/d/1wm2MThJLQqFllCJRitltj7xT1LK7ygsW`],videoUrls:[]},{id:`W015`,category:`washing`,code:`(WM48) VẮT KHÔNG KHÔ`,title:`Máy giặt vắt không khô`,description:`Bạn hoàn thành chu trình giặt nhưng quần áo vẫn vắt chưa khô. Phần này sẽ hướng dẫn bạn cách xử lý vấn đề này`,steps:[{text:`Kiểm tra xem có quá nhiều quần áo, hoặc quá ít quần áo, sẽ làm máy giặt hoặc vắt kém hiệu quả`},{text:`Đồ giặt bị dồn về 1 phía. Dàn trải quần áo ra đều khắp lồng giặt`},{text:`Kiểm tra vị trí lắp máy, cân chỉnh lại chân máy nếu máy có dấu hiệu rung lắc`},{text:`Kiểm tra lại ống xả nước, nếu ống xả bị tắc hoặc gấp khúc cần chỉnh ngay`}],images:[],videoUrls:[{url:`https://www.youtube.com/embed/A0lut76uIPY?feature=share`,type:`vertical`}]},{id:`W016`,category:`washing`,code:`(WM25) TRÀO BỌT, CÒN XÀ BÔNG TRONG LỒNG GIẶT, QUẦN ÁO`,title:`Máy sau khi giặt xong nhưng vẫn còn xà bông, bột giặt trên quần áo, lồng giặt, cửa,...`,description:`Bạn giặt đồ như thường ngày và sau một hồi xà phòng tràn ra rất nhiều. Phần này sẽ giúp bạn xử lý vấn đề này.`,steps:[{text:`Kiểm tra lại loại nước giặt, bột giặt mình đang sử dụng là gì?`},{text:`Nếu là loại cho lồng đứng mà sử dụng cho cửa trước. Bạn nên đổi lại đúng loại cho máy cửa trước.`}],images:[`https://lh3.googleusercontent.com/d/1TyfTWNYVuDlR1cfI6bR_APQSlbOOEGwn`,`https://lh3.googleusercontent.com/d/1yr1NQfz48rrFreSaVkloSPuRYc3AUwlk`],videoUrls:[{url:`https://www.youtube.com/embed/WcfoL8K5FRQ?feature=share`,type:`vertical`}]},{id:`W017`,category:`washing`,code:`(WM60) MÁY GIẶT KHÔNG GIẶT (Máy giặt cửa trên)`,title:`Máy giặt cửa trên có nguồn nhưng không giặt`,description:`Bạn mở máy lên bấm giặt máy giảm thời gian, nhưng không giặt, không thấy nước cấp hoặc nước cấp vào rất yếu, hoặc giặt một lúc máy rung lắc sau đó ngưng không giặt nữa.`,steps:[{text:`Kiểm tra van khoá nước cấp của máy. Nếu van bị khoá cần mở ra`},{text:`Áp lực nước không đủ (Áp lực nước tiêu chuẩn: 0.1 - 0.4MPa`},{text:`Kiểm tra ổ điện cắm máy, nếu ổ điện kém chất lượng cần thay thế và thử lại chương trình khác`,images:[`https://lh3.googleusercontent.com/d/17N3mSG5_dGn_Tu_eNMrR2tFa10S9jFYj`]},{text:`Nếu sử dụng máy được một thời gian cần vệ sinh bộ lọc van cấp`,images:[`https://lh3.googleusercontent.com/d/1ZduTPVJIyppJ4GxqYcZ-nUAufEZLj1hB`,`https://lh3.googleusercontent.com/d/1nk21oHoXrBX-d0KODdRJef5jl3MrX1zJ`,`https://lh3.googleusercontent.com/d/17WB5fAmpXu6MnH-Gl_i5wFIxxMnzVtBO`]},{text:`Kiểm tra máy có lắp đặt trên chân kệ hay không. Bỏ máy xuống sản phẳng và cân bằng lại máy`,images:[`https://lh3.googleusercontent.com/d/1gbBwjE5YZaAji9wa0niOV8mUbDzlgoYM`]},{text:`Mẹo: Hãy thử chương trình chỉ vắt => Nếu máy vẫn vắt bình thường hãy kiểm tra lại nguồn nước của bạn.`}],images:[],videoUrls:[{url:`https://www.youtube.com/embed/V4Zk5PtISrA?si=Q56aG5Y5NqYPms5e`,type:`vertical`}]},{id:`W018`,category:`washing`,code:`(WM47) MÁY GIẶT KHÔNG VẮT (Máy giặt cửa trên)`,title:`Máy giặt cửa trên không vắt khi đã hoàn tất chu trình giặt`,description:`Sau khi hoàn tất chu trình giặt máy giặt cửa trên của bạn không vắt không xả nước ra ngoài. Phần này sẽ hướng dẫn xử lý vấn đề đó.`,steps:[{text:`Kiểm tra dây thoát nước của máy có bị đưa lên cao quá 15cm hoặc gấp khúc hay không. Ống xả của máy cửa trên không được treo cao mà phải thả xuống sàn.`},{text:`Kiểm tra lại cân bằng của máy.`},{text:`Kiểm tra khi bỏ quần áo vào có bị dồn về 1 phía hay không hãy sắp xếp lại quần áo`},{text:`Kiểm tra máy có lắp đặt trên chân kệ hay không. Bỏ máy xuống sản phẳng và cân bằng lại máy`}],images:[],videoUrls:[{url:`https://www.youtube.com/embed/V4Zk5PtISrA?si=Q56aG5Y5NqYPms5e`,type:`vertical`}]},{id:`W019`,category:`washing`,code:`(WM47) MÁY GIẶT KHÔNG VẮT (Máy giặt cửa trước)`,title:`Máy giặt cửa trước không vắt khi đã hoàn tất chu trình giặt`,description:`Sau khi hoàn tất chu trình giặt máy giặt cửa trước của bạn không vắt không xả nước ra ngoài. Phần này sẽ hướng dẫn xử lý vấn đề đó.`,steps:[{text:`Kiểm tra máy dừng vắt ở giai đoạn nào. Có hiển thị báo lỗi trên bảng hiển thị không?`},{text:`Kiểm tra ống xả có bị thả xuống, Cố định lại ống xả theo quy định và theo dõi lại chu trình giặt khác. `},{text:`Vệ sinh bộ lọc bơm xả.`},{text:`Thử lại chu trình giặt khác nếu không khắc phục được chuyển ASP kiểm tra.`}],images:[],videoUrls:[]},{id:`W020`,category:`washing`,code:`(WM08) Cảnh báo E4 (Các Model sau này rất ít hiển thị E4 mà thay thành E3)`,title:`Mất cân bằng chân máy hoặc liên quan đến cửa máy giặt.`,description:`Máy giặt cửa trên hoặc cửa trước báo lỗi E4 hoặc E3. Nguyên nhân: Máy giặt bị mất cân bằng, hoặc liên quan đến cửa máy giặt.`,steps:[{text:`Quần áo có thể bị mất cân bằng trong lồng giặt - Nên phân loại đồ trước khi giặt`},{text:`Bạn có thể chỉ giặt một món đồ nặng như chăn bông hoặc quần jean, hoặc những món đồ nhỏ trong lưới giặt. `},{text:`Có thể bạn đang giặt quá nhiều đồ lớn như ga trải giường.`},{text:`Máy giặt có thể đang bị lắp đặt trên sàn nghiêng hoặc có thể không bằng phẳng.`}],images:[],videoUrls:[{url:`https://drive.google.com/file/d/1VjUvNS-Nl-Cvq1EM8hDD_MRweUgFj4R6/preview`,type:`horizontal`}]},{id:`W021`,category:`washing`,code:`(WM10) Lỗi C8`,title:`Lỗi C8 - Không thể tư vấn.`,description:`Lỗi liên quan đến kỹ thuật máy giặt`,steps:[{text:`Lỗi kết nối. Chuyển ASP kiểm tra`}],images:[],videoUrls:[]},{id:`W022`,category:`washing`,code:`(WM11) Lỗi F2`,title:`Lỗi F2 - Không thể tư vấn.`,description:`Lỗi liên quan đến kỹ thuật máy giặt`,steps:[{text:`Lỗi bộ nhớ. Chuyển ASP kiểm tra`}],images:[],videoUrls:[]},{id:`W023`,category:`washing`,subtype:`Lồng đứng`,code:`(WM12) Lỗi F5`,title:`Lỗi F5 - Không thể tư vấn.`,description:`Lỗi liên quan đến kỹ thuật máy giặt`,steps:[{text:`Lỗi cân đồ. Chuyển ASP kiểm tra`}],images:[],videoUrls:[]},{id:`W024`,category:`washing`,code:`(WM13) Lỗi F8`,title:`Lỗi F8 - Không thể tư vấn.`,description:`Lỗi liên quan đến kỹ thuật máy giặt`,steps:[{text:`Lỗi cảm biến mực nước. Chuyển ASP kiểm tra`}],images:[],videoUrls:[]},{id:`W025`,category:`washing`,code:`(WM14) Lỗi Fd`,title:`Lỗi Fd - Không thể tư vấn.`,description:`Lỗi liên quan đến kỹ thuật máy giặt`,steps:[{text:`Lỗi khoá nắp. Chuyển ASP kiểm tra`}],images:[],videoUrls:[]},{id:`W026`,category:`washing`,code:`(WM15) Lỗi E50/ E52 / E57/ E58 / E64 /,... `,title:`Lỗi liên quan đến motor máy giặt - Không thể tư vấn.`,description:`Lỗi liên quan đến kỹ thuật máy giặt`,steps:[{text:`Lỗi liên quan đến motor máy giặt. Chuyển ASP kiểm tra`},{text:`TĐV báo trạm bảo hành chuẩn bị sẵn linh kiện thay thế cho khách nếu máy nằm trong phạm vi bảo hành.`}],images:[],videoUrls:[]},{id:`W027`,category:`washing`,code:`(WM16) Lỗi E33`,title:`Lỗi cảm biến mực nước - Không thể tư vấn.`,description:`Lỗi liên quan đến kỹ thuật máy giặt`,steps:[{text:`Lỗi cảm biến mực nước. Chuyển ASP kiểm tra`}],images:[],videoUrls:[]},{id:`W028`,category:`washing`,code:`(WM17) Lỗi E34`,title:`Lỗi cảm biến nhiệt độ nước - Không thể tư vấn.`,description:`Lỗi liên quan đến kỹ thuật máy giặt`,steps:[{text:`Lỗi cảm biến nhiệt độ nước. Chuyển ASP kiểm tra`}],images:[],videoUrls:[]},{id:`W029`,category:`washing`,code:`(WM18) Lỗi E35`,title:`Lỗi cảm biến nhiệt độ nước - Không thể tư vấn.`,description:`Lỗi liên quan đến kỹ thuật máy giặt`,steps:[{text:`Lỗi cảm biến nhiệt độ nước. Chuyển ASP kiểm tra`}],images:[],videoUrls:[]},{id:`W030`,category:`washing`,code:`(WM19) Lỗi E36`,title:`Lỗi cảm biến nhiệt độ. - Không thể tư vấn.`,description:`Lỗi liên quan đến kỹ thuật máy giặt`,steps:[{text:`Lỗi cảm biến nhiệt độ. Chuyển ASP kiểm tra`}],images:[],videoUrls:[]},{id:`W031`,category:`washing`,code:`(WM20) Lỗi E37`,title:`Lỗi hệ thống sấy. - Không thể tư vấn.`,description:`Lỗi liên quan đến kỹ thuật máy giặt`,steps:[{text:`Lỗi hệ thống sấy. Chuyển ASP kiểm tra`}],images:[],videoUrls:[]},{id:`W032`,category:`washing`,code:`(WM21) Lỗi E38`,title:`Lỗi hệ thống sấy. - Không thể tư vấn.`,description:`Lỗi liên quan đến kỹ thuật máy giặt`,steps:[{text:`Lỗi hệ thống sấy. Chuyển ASP kiểm tra`}],images:[],videoUrls:[]},{id:`W033`,category:`washing`,code:`(WM22) Lỗi E3A`,title:`Lỗi hệ thống sấy. - Không thể tư vấn.`,description:`Lỗi liên quan đến kỹ thuật máy giặt`,steps:[{text:`Lỗi hệ thống sấy. Chuyển ASP kiểm tra`}],images:[],videoUrls:[]},{id:`W034`,category:`washing`,code:`(WM23) Lỗi E80`,title:`Lỗi bo mạch chính. - Không thể tư vấn.`,description:`Lỗi liên quan đến kỹ thuật máy giặt`,steps:[{text:`Lỗi bo mạch chính. Chuyển ASP kiểm tra`}],images:[],videoUrls:[]},{id:`W035`,category:`washing`,code:`(WM24) Nước còn đọng 1 ít trong hộc chứa xà phòng/ nước xã vải`,title:`Còn nước trong hộc chứa xà phòng/ nước xã vải.`,description:`Sau khi giặt xong vẫn còn nước trong hộc chứa xà phòng/ nước xã vải. Phần này sẽ hướng dẫn bạn xử lý vấn đề đó.`,steps:[{text:`Áp lực nước thấp (sách HDSD). Hãy kiểm tra lại áp lực nước cấp cho máy giặt.`},{text:`Máy bị nghiêng, không cân bằng. Hãy kiểm tra lại vị trí đặt máy giặt, cân chỉnh lại chân máy.`},{text:`Hộc nước xã/ nước giặt bị nghẹt. Hãy vệ sinh hộc chứa nước giặt/ nước xã vải.`},{text:`Nếu không khắc phục được hãy liên hệ trung tâm bảo hành kiểm tra.`}],images:[],videoUrls:[]},{id:`W036`,category:`washing`,code:`(WM26) Mùi bất thường`,title:`Mùi bất thường sau khi giặt.`,description:`Sau khi giặt xong vẫn còn mùi bất thường. Phần này sẽ hướng dẫn bạn xử lý vấn đề đó.`,steps:[{text:`Có thể có nấm mốc, bụi bẩn hoặc cặn chất tẩy rửa trên lồng giặt, ống xả có ghim vào đường thoát nước không?`},{text:`TDV tư vấn khách hàng vệ sinh vệ sinh ron cao su (đối với các model máy giặt cửa trước)`},{text:`Kiểm tra model có chức năng vệ sinh lồng giặt và khuyến nghị khách hàng thực hiện. Bao lâu rồi chưa vệ sinh máy giặt?`},{text:`Nếu không khắc phục được hãy liên hệ trung tâm bảo hành kiểm tra.`}],images:[],videoUrls:[]},{id:`W037`,category:`washing`,code:`(WM27) Tất cả các phím không thể điều khiển được`,title:`Tất cả các phím không thể điều khiển được`,description:`Không thể thao tác hay điều khiển các phím trên bảng điều khiển. Phần này sẽ hướng dẫn bạn xử lý vấn đề đó.`,steps:[{text:`Khóa trẻ em có thể đang được kích hoạt. Hãy kiểm tra và tắt chế độ khoá trẻ em (CL) nếu đang bật.`},{text:`Nếu không khắc phục được hãy liên hệ trung tâm bảo hành kiểm tra.`}],images:[],videoUrls:[]},{id:`W038`,category:`washing`,code:`(WM28) Không thể mở nắp cửa khi hết chương trình giặt`,title:`Không thể mở nắp cửa khi hết chương trình giặt`,description:`Sau khi giặt xong không thể mở nắp cửa. Phần này sẽ hướng dẫn bạn xử lý vấn đề đó.`,steps:[{text:`Máy giặt cửa TRÊN: TDV báo KH rút nguồn và 1 phút sau cắm lại`},{text:`Nếu không khắc phục được hãy liên hệ trung tâm bảo hành kiểm tra.`}],images:[],videoUrls:[]},{id:`W039`,category:`washing`,code:`(WM29) Máy mất nguồn`,title:`Máy mất nguồn`,description:`Máy giặt bật không lên nguồn hoặc đang thao tác thì bị mất nguồn. Phần này sẽ hướng dẫn bạn xử lý vấn đề đó.`,steps:[{text:`TDV tư vấn KH kiểm tra lại cắm điện/ phích cắm, ổ cắm điện, dây nguồn, cầu dao điện, aptomat, dây điện có bị hở hay không.`},{text:`Nếu không khắc phục được hãy liên hệ trung tâm bảo hành kiểm tra.`}],images:[],videoUrls:[]},{id:`W040`,category:`washing`,code:`(WM30) Hiển thị các thay đổi thời gian còn lại`,title:`Hiển thị các thay đổi thời gian còn lại`,description:`Máy giặt giặt lâu, hoặc giặt gần xong thì tăng lại thời gian lên. Phần này sẽ hướng dẫn bạn xử lý vấn đề đó.`,steps:[{text:`Thời gian giặt có thể bị kéo dài nếu tải không cân bằng, vì máy giặt cố gắng điều chỉnh sự mất cân bằng.`},{text:`Thời gian giặt có thể bị kéo dài khi có quá nhiều bọt, vì cần phải thực hiện thêm hành động loại bỏ bọt.`},{text:`Áp lực nước yếu có thể kéo dài thời gian cấp nước vào lồng giặt, vì vậy hãy kiểm tra áp lực nước.`},{text:`Đường thoát nước xả của máy đang lắp đặt sai. (Hãy kiểm tra máy của KH là cửa trước hay cửa trên).`}],images:[],videoUrls:[]},{id:`W041`,category:`washing`,code:`(WM32) Tiếng ồn trong chu kỳ xả nước`,subtype:`Lồng ngang`,title:`Tiếng ồn trong chu kỳ xả nước`,description:`Máy đang xả nước và KH nghe thấy tiếng ồn. Phần này sẽ hướng dẫn bạn xử lý vấn đề đó.`,steps:[{text:`Điều này là bình thường. Có thể có tiếng ồn khi máy bơm xả đang hoạt động (chỉ xuất hiện máy giặt cửa trước)`}],images:[],videoUrls:[]},{id:`W042`,category:`washing`,code:`(WM33) Tiếng ồn hoặc độ rung bất thường `,subtype:`Lồng ngang`,title:`Tiếng ồn hoặc độ rung bất thường `,description:`Máy đang hoạt động và có tiếng ồn hoặc rung mạnh. Phần này sẽ hướng dẫn bạn xử lý vấn đề đó.`,steps:[{text:`Tiếng của motor xã nước (chỉ có ở máy giặt lồng ngang)`},{text:`Các bu lông vận chuyển có thể chưa được tháo ra.`},{text:`Máy giặt có thể được lắp đặt trên bề mặt dốc hoặc không ổn định hoặc đặt trên chân inox, hoặc chân máy gập gềnh`},{text:`Có thể có vật lạ bên trong lồng giặt.`},{text:`Nếu không khắc phục được hãy liên hệ trung tâm bảo hành kiểm tra.`}],images:[],videoUrls:[]},{id:`W043`,category:`washing`,code:`(WM34) Nước cấp và xã ra đồng thời liên tục`,title:`Nước cấp và xã ra đồng thời liên tục`,description:`Máy cấp nước và xả nước đồng thời liên tục. Phần này sẽ hướng dẫn bạn xử lý vấn đề đó.`,steps:[{text:`Kiểm tra lại van cấp nước có bị bẩn. (Vệ sinh)`},{text:`Kiểm tra lại ống xả có bị thả xuống (Nếu là máy giặt lồng ngang). Nếu bị thả xuống giải thích với KH và hướng dẫn KH treo lại ống xả lên theo HDSD.`},{text:`Máy giặt có thể được lắp đặt trên bề mặt dốc hoặc không ổn định hoặc đặt trên chân inox, hoặc chân máy gập gềnh`},{text:`Đối với máy giặt lồng ngang nếu ống xã không được treo cao sẽ xuất hiện tình trạng này.`},{text:`Nếu không khắc phục được hãy liên hệ trung tâm bảo hành kiểm tra.`}],images:[],videoUrls:[]},{id:`W044`,category:`washing`,code:`(WM35) Công tắc cửa đóng/ mở liên tục`,title:`Công tắc cửa đóng/ mở liên tục`,description:`Công tắc cửa đóng/ mở liên tục. Phần này sẽ hướng dẫn bạn xử lý vấn đề đó.`,steps:[{text:`TĐV chuyển ASP kiểm tra.`}],images:[],videoUrls:[]},{id:`W045`,category:`washing`,code:`(WM36) Nước xả ra liên tục`,title:`Nước xả ra liên tục`,description:`Nước xả ra liên tục.`,steps:[{text:`TĐV chuyển ASP kiểm tra.`}],images:[],videoUrls:[]},{id:`W046`,category:`washing`,subtype:`Máy sấy`,code:`(WM37) Quần áo còn ướt sau khi sấy. Sấy không khô`,title:`Quần áo còn ướt sau khi sấy, sấy không khô`,description:`Quần áo còn ướt sau khi sấy, sấy không khô. Phần này sẽ hướng dẫn bạn xử lý vấn đề đó.`,steps:[{text:`Phân loại đồ trước khi cho vào máy sấy. Nên vắt quần áo ráo nước để máy sấy sấy hiệu quả hơn.`},{text:`Không nên sấy vượt quá số kg quy định, Tư vấn KH sử dụng loại ổ điện tốt.`},{text:`Nếu KH không phân loại quần áo, nên hướng dẫn KH chọn chương trình đồ hỗn hợp và chọn mức sấy cao nhất. Sau đó sấy lại 1 lần khác`},{text:`Kiểm tra và vệ sinh bộ lọc xơ vải.`}],images:[],videoUrls:[]},{id:`W048`,category:`washing`,code:`(WM39) Ron cửa bị rách, gập`,title:`Ron cửa bị rách, gập`,description:`Ron cửa bị rách, gập`,steps:[{text:`TDV trao đổi khách hàng có để quần áo bị kẹt khi đóng cửa không? Căn cứ chính sách các trường hợp không bảo hành - kiến nghị khách hàng (nếu hư hỏng do các yếu tố tác động có thể) sẽ sửa chữa tính phí`},{text:`Báo KTV kiểm tra cho KH.`}],images:[],videoUrls:[]},{id:`W049`,category:`washing`,code:`(WM40) Nước giặt/ nước xả không cấp`,title:`Nước giặt/ nước xả không cấp`,description:`Nước giặt/ nước xả không cấp`,steps:[{text:`Căn cứ sách HDSD tư vấn KH điều chỉnh lại mức nước giặt/ xã phù hợp (CHỈ CÓ Ở MODEL T25-T22-BM115-BM135)`},{text:`Nếu không thể xử lý. Báo ASP kiểm tra`}],images:[],videoUrls:[]},{id:`W050`,category:`washing`,code:`(WM41) Máy không có nguồn, máy giặt không nguồn`,title:`Máy không có nguồn`,description:`Máy không có nguồn`,steps:[{text:`TDV tư vấn khách hàng kiểm tra lại ổ cắm + phích cắm. Nếu máy vẫn không hoạt động, dùng thiết bị điện khác cắm thử vào ổ cắm để kiểm tra. (Nên tư vấn KH sử dụng loại ổ cắm tốt, tránh TH kéo dài ổ cắm.)`},{text:`TDV báo ASP kiểm tra cho khách hàng`}],images:[],videoUrls:[]},{id:`W051`,category:`washing`,code:`(WM42) Âm thanh khác`,title:`Âm thanh khác`,description:`Âm thanh khác`,steps:[{text:`TDV khai thác âm thanh lạ này phát sinh khi nào?`},{text:`Tư vấn khách hàng kiểm tra có vật lại rớt trong lồng giặt không?`},{text:`Nếu không khắc phục được. Báo ASP kiểm tra`}],images:[],videoUrls:[]},{id:`W052`,category:`washing`,code:`(WM43) Máy kêu to khi giặt`,title:`Máy kêu to khi giặt`,description:`Máy kêu to khi giặt`,steps:[{text:`Máy đang được lắp đặt trên nền cứng, vững chưa? (Khuyến cáo không đặt máy trên chân inox, chân nhựa cao...)`},{text:`Máy khách hàng mua bao lâu? Tiếng kêu phát sinh từ khi nào?`},{text:`Nếu khách hàng mới mua tư vấn khách hàng kiểm tra lại máy đã tháo ốc giữ lồng giặt chưa.`},{text:`Tư vấn khách hàng khi giặt đồ thường có tiếng do quần áo rơi từ vị trí cao xuống thấp.`},{text:`Kiểm tra khách hàng xem có vật lạ rơi trong máy?`},{text:`-------Đối với Các Model lồng đứng dưới 10Kg-------`},{text:`Tư vấn KH chỉ giặt 70-80% lượng đồ tối đa so với khối lượng giặt của máy. Sau đó theo dõi. Không nên bỏ quá tải. (Nếu tính đúng 10kg đồ khô ở ngoài thì khi bỏ vào và cấp nước sẽ vượt khối lượng giặt tối đa của máy).`},{text:`Không được để máy ở trên chân đề Inox vì nếu đặt cao máy dễ mất cân bằng và gây rung lắc mạnh`}],images:[],videoUrls:[]},{id:`W053`,category:`washing`,code:`(WM44) Máy kêu to khi vắt`,title:`Máy kêu to khi vắt`,description:`Máy kêu to khi vắt`,steps:[{text:`Máy đang được lắp đặt trên nền cứng, vững chưa? (Khuyến cáo không đặt máy trên chân inox, chân nhựa cao...)`},{text:`Máy chưa được lắp cân bằng?`},{text:`Bạn có thể chỉ giặt một món đồ nặng như chăn bông hoặc quần jean, hoặc những món đồ nhỏ trong lưới giặt.`},{text:`Có thể bạn đang giặt quá nhiều đồ lớn như ga trải giường.`},{text:`Kiểm tra khách hàng xem có vật lạ rơi trong máy?`},{text:`-------Đối với Các Model lồng đứng dưới 10Kg-------`},{text:`Tư vấn KH chỉ giặt 70-80% lượng đồ tối đa so với khối lượng giặt của máy. Sau đó theo dõi. Không nên bỏ quá tải. (Nếu tính đúng 10kg đồ khô ở ngoài thì khi bỏ vào và cấp nước sẽ vượt khối lượng giặt tối đa của máy).`},{text:`Không được để máy ở trên chân đề Inox vì nếu đặt cao máy dễ mất cân bằng và gây rung lắc mạnh`}],images:[],videoUrls:[]},{id:`W054`,category:`washing`,code:`(WM45) Giặt xong có vết bẩn lạ, bụi bẩn trên quần áo`,title:`Giặt xong có vết bẩn lạ, bụi bẩn trên quần áo`,description:`Giặt xong có vết bẩn lạ, bụi bẩn trên quần áo`,steps:[{text:`Hỏi model số máy, ngày mua, trước đây có hiện tượng này?`},{text:`Hỏi thêm thông tin có lấy hết vật dung trong túi quần/áo như (Giấy, tiền,…) khi giặt sẽ bị nước rã ra tạo ra vết lấm tấm trên quần áo.`},{text:`Hướng dẫn khách kiểm tra vết trên quần áo là do xà bông hay bụi giấy dùng tay nước để chà lên vết nếu vết đó nhớt là do xà bông. HD đổi sang nước giặt xem có còn gặp tình trạng.`},{text:`Tư vấn khách hàng vệ sinh lồng giặt, bộ lọc sơ vải, dùng chương trình vệ sinh lồng giặt.`},{text:`Nếu không khắc phục được. Báo ca ASP Kiểm tra`}],images:[],videoUrls:[]},{id:`W055`,category:`washing`,code:`(WM46) Máy lúc giặt lúc không (Model máy giặt lồng đứng)`,title:`Máy lúc giặt lúc không (Model máy giặt lồng đứng)`,description:`Máy lúc giặt lúc không (Model máy giặt lồng đứng)`,steps:[{text:`Kiểm tra nguồn cấp điện của KH (ổ cắm, dây nguồn,…) có bị lỏng lẻo đổi ổ cắm khác để thử.`},{text:`Kiểm tra máy có đặt trên chân đế khiến không cân bằng lúc vắt/giặt sẽ đập vào thành làm máy bị ngưng`},{text:` Kiểm tra cân bằng đồ trong lồng giặt.`},{text:` Nếu tư vấn những vấn đề trên nhưng vẫn không được tạo ca gửi KTV`}],images:[],videoUrls:[]},{id:`W056`,category:`washing`,code:`(WM47) Không vắt`,title:`Không vắt`,description:`Không vắt`,steps:[{text:`Máy dừng vắt ở giai đoạn nào?`},{text:`Khi ngừng vắt, máy có báo lỗi gì trên bảng hiển thị không?`},{text:`Kiểm tra ống xả nước của máy:`},{text:`Lồng Đứng: Ống có bị gấp khúc hoặc kẹt vật lạ,… Điều chỉnh lại ống xả, hoặc vệ sinh vật bị kẹt. Sau đó theo dõi lại chu trình giặt khác.`},{text:`Lồng Ngang: Kiểm tra ống xả có bị thả xuống, Cố định lại ống xả theo quy định và theo dõi lại chu trình giặt khác. Vệ sinh bộ lọc bơm xả.`},{text:`Nếu không khắc phục được, Báo ASP kiểm tra`}],images:[],videoUrls:[]},{id:`W058`,category:`washing`,code:`(WM49) Máy sấy sấy không khô quần áo`,subtype:`Máy sấy`,title:`Máy sấy sấy không khô quần áo`,description:`Máy sấy sấy không khô quần áo`,steps:[{text:`Vệ sinh sạch lưới lọc xơ vải đằng trước máy`},{text:`Vệ sinh và đổ nước trong hộp chứa nước (Tuỳ model)`},{text:`Phân loại quần áo`},{text:`Khuyến nghị khách hàng vắt thêm 1 lần nữa`},{text:`Nếu không khắc phục được, Báo ASP kiểm tra`}],images:[],videoUrls:[]},{id:`W059`,category:`washing`,code:`(WM50) Đèn hiển thị không sáng`,title:`Đèn hiển thị không sáng`,description:`Đèn hiển thị không sáng`,steps:[{text:`Kiểm tra lại ổ cắm điện.`},{text:`Thử thao tác tắt mở máy .`},{text:`Nếu được xin lại video tình trạng của máy KH.`},{text:`Nếu không khắc phục được, Báo ASP kiểm tra`}],images:[],videoUrls:[]},{id:`W060`,category:`washing`,code:`(WM51) Máy rò rỉ nước vào lồng giặt`,title:`Máy rò rỉ nước vào lồng giặt`,description:`Máy rò rỉ nước vào lồng giặt`,steps:[{text:`Trước khi mở nguồn máy giặt nước có chảy không?`},{text:`Không bật nguồn máy giặt vẫn chảy nước vào lồng giặt => Tạo ca`},{text:`Có bật nguồn nước chảy vào lồng giặt. Giải thích với khách hàng hiện tượng bình thường.`},{text:`Nếu không khắc phục được, Báo ASP kiểm tra`}],images:[],videoUrls:[]},{id:`W061`,category:`washing`,code:`(WM54) Chảy nước dưới đáy máy`,title:`Chảy nước dưới đáy máy`,description:`Chảy nước dưới đáy máy`,steps:[{text:`Nhờ KH xác định được nước chảy ra từ đâu của máy giặt (Dưới đáy máy, ống xả, nước trào ra từ bên trong lồng giặt`},{text:`Nếu nước chảy ra từ trong lồng giặt. Nhờ KH kiểm tra cửa đã đóng chắc chưa. Nước chảy ra là xà phòng hay nước thường.`},{text:`→ Nếu là xà phòng kiểm tra loại nước giặt/ xả KH đang sử dụng`},{text:`→ Nếu là nước thường, ghi nhận lại TH báo trạm kiểm tra`},{text:`Nếu nước chảy ra từ dưới đáy`},{text:`Kiểm tra đường ống xả có thoát tốt hoặc có bị tắc ở đâu ? Nếu phần bên ngoài không bị tắc hoặc không bể. Mà vẫn có nước chảy ra từ dưới đáy máy. Báo trạm xuống kiểm tra TH này. `}],images:[],videoUrls:[]},{id:`W062`,category:`washing`,code:`(WM55) BẢO HÀNH MOTOR`,title:`BẢO HÀNH MOTOR`,description:`Trong quá trình làm việc nếu CC nhận được các model: Model: TW-BK105S2V(WS). TWD-BM135GF4V(MG) ( Nếu sản xuất trong thời gian 8/2022 -> 5/2023. Sẽ được thay Motor chính miễn phí part: 11002015010046 ; 11002015012788) - Thời gian áp dụng Từ  25/10/2025 - 31/12/2025 - Nguồn: Khách hàng/ Đại lý + Trạm báo thông tin (CC gọi xác minh) - Phạm vi : Toàn Quốc`,steps:[{text:`Nếu không thể thực hiện FCR bắt buộc tạo ca, CC lưu ý trong quá trình trao đổi khách hàng kiểm tra lịch sử sản phẩm nếu`},{text:`Repair 0:  Mã HOT KEY đang gặp + WM55: APS đem theo motor tư vấn + thay cho khách hàng - xác LK Trạm dán tem ngoài  motor (LAD PROJECT 1) `},{text:`Repair 1/ n lần nhưng chưa lần nào thay motor: Mã HOT KEY đang gặp + WM55: APS đem theo motor tư vấn + thay cho khách hàng - xác LK Trạm dán tem ngoài  motor (LAD PROJECT 1)`},{text:`Repair 1/ n lần nhưng đã thay motor: Xin ý kiến  A THẢO trước. Mã HOT KEY đang gặp + nội dung A Thảo yêu cầu xử lý`}],images:[],videoUrls:[]},{id:`W063`,category:`washing`,code:`(WM56) Máy sấy không có chức năng chống nhắn`,title:`Máy sấy không có chức năng chống nhắn`,description:`Máy sấy không có chức năng chống nhắn. Đối với các model mới (TD-T25, TD-T37, TD-T21)`,steps:[{text:`Đối với các model mới (TD-T25, TD-T37, TD-T21). Vẫn có tính năng chống nhăn, nhưng sẽ không có trên bảng điều khiển. Sẽ tích hợp tính năng chống nhăn trong phần IOT của máy.`},{text:`Xác định model của KH.`},{text:`HD KH kết nối IOT, và HD KH kích hoạt tính năng chống nhăn trên ứng dụng TSmart Life`},{text:`Nếu không khắc phục được. Báo ASP kiểm tra`}],images:[],videoUrls:[]},{id:`W064`,category:`washing`,subtype:`Máy sấy`,code:`(WM58) Máy sấy có âm thanh lạ khi hoạt động, Máy sấy kêu to.`,title:`Máy sấy có âm thanh lạ khi hoạt động, Máy sấy kêu to.`,description:`Máy sấy có âm thanh lạ khi hoạt động, Máy sấy kêu to.`,steps:[{text:`Tình trạng có xảy ra liên tục hay chỉ đôi khi xảy ra`},{text:`Khai thác KH 2 trạng thái của máy sấy: Sấy có đồ, Sấy không đồ`},{text:`Khi sấy có đồ: nếu có tiếng kêu lạch cạch xảy ra => Giả thích với KH, đây là hiện tượng bình thường. Do áo khoác hoặc quần jean, sẽ có nút bằng kim loại va chạm vào lồng sấy nên sẽ có tiếng kêu. KH yên tâm sử dụng.`},{text:`Khi sấy không có đồ: Nếu KH sử dụng máy sấy mà không có quần áo mà gây ra tiếng ồn lớn, mà trước đây không có. => Báo KTV kiểm tra cho KH`},{text:`Nếu không khắc phục được. Báo ASP kiểm tra`}],images:[],videoUrls:[]},{id:`W065`,category:`washing`,subtype:`Lồng ngang`,code:`(WM62) Máy giặt không xả nước`,title:`Máy giặt lồng ngang không xả nước`,description:`Máy giặt lồng ngang không xả nước`,steps:[{text:`Máy giặt tới chu trình xả nhưng không xả hết nước ra. Tư vấn KH chạy thử chu trình Chỉ vắt lần nữa xem máy có xả hết nước hay không`},{text:`Kiểm tra lại bộ lọc bơm xả đằng trước máy. Nếu bẩn nên tháo ra vệ sinh lắp lại.`},{text:`Kiểm tra ống xả có bị gấp khúc hoặc kẹt vật lạ hay không`},{text:`Sau khi hoàn tất kiểm tra thử lại chu trình chỉ vắt`},{text:`Nếu không khắc phục được. Báo ASP kiểm tra`}],images:[],videoUrls:[]},{id:`W066`,category:`washing`,subtype:`Lồng đứng`,code:`(WM63) Máy giặt không xả nước`,title:`Máy giặt lồng đứng không xả nước`,description:`Máy giặt lồng đứng không xả nước`,steps:[{text:`Máy giặt tới chu trình xả nhưng không xả hết nước ra. Tư vấn KH chạy thử chu trình Chỉ vắt lần nữa xem máy có xả hết nước hay không`},{text:`Kiểm tra ống xả có bị treo lên quá cao (> 15cm), thử thả xuống dưới sàn, nếu ống xả gấp khúc hoặc kẹt vật lạ nên xử lý và thử lại chu trình chỉ vắt`},{text:`Sau khi hoàn tất kiểm tra thử lại chu trình chỉ vắt`},{text:`Nếu không khắc phục được. Báo ASP kiểm tra`}],images:[`https://lh3.googleusercontent.com/d/1zYeOB_XkqkLIZkzd8c_LS0Gmwkav01X0`],videoUrls:[]}],$n=[{id:`F01`,category:`fridge`,code:`(R001) Cả tủ không lạnh`,title:`Tủ lạnh không làm lạnh`,description:`Mở tủ ra không thấy có hơi lạnh`,steps:[{text:`Kiểm tra tủ có nguồn không? Vui lòng kiểm tra đèn led có sáng và máy nén có hoạt động không, xem lại ổ cắm điện`},{text:`KH cách cài đặt theo từng model đã đúng cách chưa?`},{text:`Nếu Led sáng + 2 bên hông tủ có nóng không +  cài đặt đúng`},{text:`Báo ASP kiểm tra`}],images:[`https://lh3.googleusercontent.com/d/17RWtS1AsR0Qfxtd3B_Te09xQX3AagB9v`]},{id:`F02`,category:`fridge`,code:`(R002) Mùi bất thường`,title:`Tủ lạnh có mùi bất thường`,description:`Tủ lạnh bạn sử dụng có mùi hôi, mùi lạ, mùi khó chịu. Khẳng định: Bản thân tủ không tự tạo ra mùi, chỉ có thể xuất phát từ thực phẩm nào đó. Đề nghị vệ sinh và đặt vào tủ café, trà, hoặc vỏ chanh cắt nhỏ.`,steps:[{text:`Mùi đang phản ánh chi tiết là mùi gì?`},{text:`Mùi lạ xuất hiện ở ngăn nào? từ khi nào?  vệ sinh tủ định kỳ chưa?`},{text:`Có trữ thực phẩm nặng mùi trong tủ không (mít, sầu riêng, cá khô) → Dùng màng bọc thực phẩm hoặc bỏ hộp kín)`},{text:`Tư vấn khách hàng vệ sinh tủ + dùng bột café chưa pha/ trà để khử mùi vào chén và bỏ trong tủ để khử mùi`},{text:` Nếu mùi vẫn còn, báo ASP kiểm tra`}],images:[]},{id:`F03`,category:`fridge`,code:`(R003) Không thể đóng được cửa`,title:`Tủ lạnh không thể đóng được cửa`,description:`Tủ lạnh bạn sử dụng không thể đóng được cửa.  `,steps:[{text:`Đã lắp đúng khay kệ cửa chưa. Có thể khay kệ làm cấn cửa không thể đóng được?`},{text:`Các hộp thực phẩm có đặt sau viền khay kính không?`},{text:` Nếu sau khi sắp xếp cửa vẫn không đóng được, báo ASP kiểm tra`}],images:[]},{id:`F04`,category:`fridge`,code:`(R004) Tủ lạnh không hoạt động`,title:`Tủ lạnh không hoạt động`,description:`Tủ lạnh bạn sử dụng không hoạt động, không làm lạnh hoặc không sáng đèn.  `,steps:[{text:`Thuyết phục khách hàng kiểm tra phích cắm tủ có bị hư hỏng không?`},{text:`Ổ cắm điện có nguồn không?. Cắm thử ổ cắm khác để kiểm tra hoặc cắm thiết bị khác vào ổ cắm để kiểm tra.`},{text:`Nếu 2 yếu tố trên tốt, báo ASP kiểm tra`}],images:[]},{id:`F05`,category:`fridge`,code:`(R005) Sương, hơi nước đọng bên ngoài tủ`,title:`Có sương, hoặc hơi nước đọng ở cửa thân tủ hoặc bên ngoài tủ lạnh của bạn.`,description:`Tủ lạnh của bạn có sương hoặc hơi nước đọng ở cửa thân tủ hoặc bên ngoài tủ lạnh. Đây là hiện tượng bình thường khi môi trường xung quanh có độ ẩm cao, hoặc tủ lạnh được đặt ở nơi gần cửa sổ trong thời tiết ẩm.`,steps:[{text:`Khi độ ẩm trong không khí tăng lên như trong những ngày mưa, ban đêm hoặc sáng sớm sương có thể ngưng tụ trên bề mặt bên ngoài của tủ lạnh. Hãy sạch lau sương bằng một mảnh vải khô`},{text:`Khi nhiệt độ được đặt ở mức lạnh nhất, sương có thể ngưng tụ trên bề mặt bên ngoài của tủ lạnh. Hãy thiết lập chế độ Trung Bình. Ngoài ra, hãy lau sạch sương bằng một mảnh vải khô.`},{text:`Tư vấn KH mua thiết bị theo dõi độ ẩm đặt ở khu vực xung quanh tủ. (Thường độ ẩm cao >70%).`},{text:` Nếu sương đọng ngày này qua ngày khác, báo ASP kiểm tra`}],images:[]},{id:`F06`,category:`fridge`,code:`(R006) Sương, hơi nước đọng bên trong tủ`,title:`Có sương, hoặc hơi nước đọng ở bên trong tủ lạnh (Chủ yếu là ngăn trữ)`,description:`Tủ lạnh của bạn có sương hoặc hơi nước đọng ở bên trong ngăn mát, trên đồ ăn, khay kính hoặc vách trong của tủ lạnh. Đây là hiện tượng bình thường khi môi trường xung quanh có độ ẩm cao, Tần suất mở cửa thường xuyên sẽ làm ẩm lọt vào bên trong.`,steps:[{text:`Ktra cửa tủ lạnh có bị hở không? quan sát bề mặt ron tủ có bị đọng sương ko? Hãy kiểm tra không để túi thực phẩm hoặc túi nhựa kẹp giữa cửa và khung cửa khi đóng tủ`},{text:`Khi mở cửa thường xuyên hoặc nếu mở cửa khi độ ẩm xung quanh tủ lạnh là rất cao, độ ẩm trong không khí có thể trở thành sương đọng trên thành bên trong hoặc các bộ phận của ngăn mát hoặc xung quanh (ống thổi khí mát - cửa thổi gió). Đây không phải là vấn đề. Hãy cố gắng không mở cửa quá nhiều lần hoặc để cửa mở quá lâu.`},{text:`Ngoài ra, hãy dùng một mảnh vải khô lau sạch sương được tạo ra bên trong ngăn mát. Mở cửa nhiều lần làm tủ chạy mạnh hơn tiếu hao năng lượng điện nhiều hơn. Khẳng định tủ ko tự tạo ra sương, sương chỉ xuất hiện hiện khi có nguồn hơi nước từ thực phẩm hoặc do mở cửa tủ nhiều lần.`},{text:`Độ ẩm của ngăn rau quả cao hơn so với các ngăn khác. Theo đó, tùy thuộc vào số lượng hoặc loại rau củ được bảo quản, lượng sương ngưng tụ được tạo ra có thể khác nhau trên nắp nhựa của ngăn rau quả. Tuy nhiên, đây không phải là vấn đề. Nếu bạn (không cần loại sương này - muốn giảm hiện tượng sương này), hãy bọc rau quả trong màng nhựa. Ngoài ra, khi sự ngưng tụ sương xảy ra nhiều lần, nước có thể bị đọng lại trong ngăn rau quả. Hãy lau sạch nước bằng một mảnh vải khô.`}],images:[]},{id:`F07`,category:`fridge`,code:`(R007) Tuyết xuất hiện vách tủ. Tuyết xuất hiện trên ngăn đá.`,title:`Có tuyết xuất hiện trên vách tủ hoặc trên ngăn đá (Chủ yếu là ngăn đá)`,description:`Tủ lạnh của bạn có tuyết xuất hiện trên vách tủ hoặc trên ngăn đá. Đây là hiện tượng bình thường khi môi trường xung quanh có độ ẩm cao, Tần suất mở cửa thường xuyên sẽ làm ẩm lọt vào bên trong.`,steps:[{text:`Ktra cửa tủ lạnh có bị hở không? quan sát bề mặt ron tủ có bị đọng sương ko? Kiểm tra màng bọc giấy gói thực phẩm không bị kẹp để không tạo khoảng cách giữa cánh cửa và gioăng khi bạn đóng cửa`},{text:`Khi mở cửa thường xuyên hoặc nếu mở cửa khi độ ẩm xung quanh tủ lạnh cao, độ ẩm trong không khí có thể trở thành tuyết hoặc đá đọng trên thành bên trong hoặc các bộ phận của ngăn đá, hoặc xung quanh (ống dẫn khí - cửa thổi gió). Đây không phải là vấn đề. Hãy cố gắng không mở cửa quá nhiều lần hoặc để cửa mở quá lâu. Ngoài ra, hãy dùng một mảnh vải khô lau sạch tuyết hoặc đá được tạo ra bên trong ngăn đá.`},{text:`Khi trong tủ lạnh lưu trữ nhiều chất lỏng hoặc nước trong cùng một thời điểm, nước hoặc chất lỏng có thể bốc hơi và biến thành tuyết hoặc đá đọng trên thành tủ lạnh hoặc các bộ phận của ngăn đá`},{text:`Xung quanh (ống dẫn khí - cửa thổi gió). Bạn có thể (ngăn chặn - giảm) tuyết và đá bằng cách (đậy nắp - chứa thực phẩm trong hộp kín hoặc màng bọc thực phẩm) để tránh bay hơi. Hãy dùng một mảnh vải khô lau sạch tuyết hoặc đá được tạo ra bên trong ngăn đá.`},{text:`Nếu không khắc phục được, báo ASP kiểm tra`}],images:[]},{id:`F08`,category:`fridge`,code:`(R008) Nứt, bể, vỡ`,title:`Có nứt, bể, vỡ.`,description:`Nứt, bể, vỡ`,steps:[{text:`Dealer căn cứ theo chính sách bể vỡ không nằm trong phạm vi bảo hành`},{text:`Nếu không khắc phục được. Báo ASP kiểm tra`}],images:[]},{id:`F09`,category:`fridge`,code:`(R009) Lỗi màu sơn cửa`,title:`Có lỗi màu sơn cửa.`,description:`Lỗi màu sơn cửa`,steps:[{text:`Thuyết phục khách hàng gửi các hình ảnh để CC làm việc với BPKT`},{text:`Hình tổng thể tủ (Khoanh vị trí lỗi)`},{text:`Tem tủ (Số máy)`},{text:`Hình lỗi chi tiết. Đối các lỗi màu cửa kính khuyến cáo EU chụp góc nghiên để BPKT nhìn rõ hơn`}],images:[]},{id:`F10`,category:`fridge`,code:`(R010) Tủ bị biến dạng, nứt, bể.`,title:`Tủ bị biến dạng, nứt, bể.`,description:`Tủ bị biến dạng, nứt, bể.`,steps:[{text:`Thuyết phục khách hàng gửi các hình ảnh để CC làm việc với BPKT`},{text:`Hình tổng thể tủ (Khoanh vị trí lỗi)`},{text:`Hình lỗi chi tiết (3- 4 tấm hình)`},{text:`Riêng TH của Dealer`},{text:`Hình 4 mặt vỏ thùng`},{text:`Nếu không khắc phục được. Báo ASP kiểm tra`}],images:[]},{id:`F11`,category:`fridge`,code:`(R011) Cửa không đều, không cân bằng.`,title:`Cửa không đều, không cân bằng.`,description:`Cửa không đều, không cân bằng.`,steps:[{text:`Tình trạng này sẽ xuất hiện ở các dòng nhiều cửa/ SBS - Sách HDSD có ghi chú cách cân chỉnh bằng chân tăng đưa. Thuyết phục KH cân chỉnh, và chỉ có khả năng cân chỉnh tương đối, không thể tuyệt đối `},{text:`TDV báo ASP kiểm tra + cân chỉnh cho KH`}],images:[]},{id:`F12`,category:`fridge`,code:`(R012) Đóng cửa này bật cửa kia.`,title:`Đóng cửa này bật cửa kia.`,description:`Đóng cửa này bật cửa kia.`,steps:[{text:`Vì ngăn đá và ngăn lạnh thông với nhau nên khi đóng mạnh cửa này sẽ tạo áp lực đẩy cửa kia ra`},{text:`Điều này bình thường, nên đóng cửa nhẹ nhàng`},{text:`HIỆN TƯỢNG NÀY THƯỜNG XẢY RA TỦ NGĂN ĐÁ TRÊN/ NGĂN ĐÁ DƯỚI`},{text:`Nếu không khắc phục được. Báo ASP kiểm tra`}],images:[]},{id:`F13`,category:`fridge`,code:`(R013) Có khe hở ở ron cửa tủ lạnh.`,title:`Có khe hở ở ron cửa tủ lạnh.`,description:`Có khe hở ở ron cửa tủ lạnh.`,steps:[{text:`Các hộp thực phẩm có đặt sau viền khay kính không?`},{text:`Ron cửa có bị gập không?`},{text:`Nếu không khắc phục được. Báo ASP kiểm tra`}],images:[]},{id:`F14`,category:`fridge`,code:`(R014) Nóng 2 bên hông tủ lạnh.`,title:`Nóng 2 bên hông tủ lạnh.`,description:`Nóng 2 bên hông tủ lạnh.`,steps:[{text:`Hệ thống giải nhiệt được bố trí (bên trong vách - xung quanh thân) tủ khi tủ hoạt động. Sau lưng và 2 bên thân tủ sẽ nên nhiệt độ mặt sau và hai bên tủ có thể bị nóng nóng hơn khi tủ mới hoạt động hoặc khi đóng, mở cửa tủ quá thường xuyên`},{text:`Đây là hiện tượng bình thường của sản phẩm`},{text:`Với một thiết bị điện lạnh, tương tự như máy lạnh, thì sẽ có cục nóng để tản nhiệt, trao đổi nhiệt với môi trường, và cục lạnh để làm giảm nhiệt độ nơi mong muốn, thì tủ lạnh cũng vậy, cũng sẽ có bên ngoài thân tủ là nơi để tản nhiệt, trao đổi nhiệt với môi trường bên ngoài, và bên trong ngăn sẽ có dàn lạnh để giảm nhiệt độ tủ lạnh. Khi trao đổi tản nhiệt bên ngoài tốt, thì tủ làm lạnh cũng sẽ tốt, để trao đổi, giải nhiệt được, thì bắt buộc nhiệt độ thân vỏ phải cao hơn so với nhiệt độ môi trường, chưa kể còn phụ thuộc vào mức độ nhiệt đang mong muốn càng sâu càng lạnh, thì sẽ tỏa nhiệt sẽ cao hơn !`},{text:`Đó là cơ chế hoạt động bình thường của tủ không phải hư hỏng !`},{text:`Nếu không khắc phục được. Báo ASP kiểm tra`}],images:[]},{id:`F15`,category:`fridge`,code:`(R015) Đá viên nhỏ, hình dáng không đều.`,title:`Đá viên nhỏ, hình dáng không đều.`,description:`Đá viên nhỏ, hình dáng không đều.`,steps:[{text:`Vì khay làm đá có các rãnh để nước được châm đều, do đó viên đá có thể có các phần thừa này`},{text:`Nếu không khắc phục được. Báo ASP kiểm tra`}],images:[]},{id:`F16`,category:`fridge`,code:`(R016) Đá viên dính chặt lại với nhau `,title:`Đá viên dính chặt lại với nhau `,description:`Đá viên dính chặt lại với nhau `,steps:[{text:`Có bị cúp điện không?.`},{text:`Cửa có bị mở thường xuyên không?.`},{text:`Vì khi nhiệt độ trong ngăn đá tăng lên, các viên đá tan ra và dính lại với nhau. Hãy lấy hộc chứa đá ra và đổ bỏ lượng đá này đi, sau đó làm mẻ đá mới. Trong lúc này nên hạn chế mở cửa tủ quá thường xuyên. Không sử dụng chức năng lấy đá ngoài trong thời gian dài`},{text:`Nếu chức năng lấy đá ngoài không được sử dụng thường xuyên các viên đá có thể dính lại với nhau, nên lấy đá ngoài thường xuyên hơn.`},{text:`Cửa tủ có bị hở không?. Nếu cửa tủ không được đóng kín, nhiệt độ ngăn đông có thể tăng lên và các viên đá tan ra và dính lại với nhau. Hãy đóng cửa tủ cho kín`},{text:`Nếu không khắc phục được. Báo ASP kiểm tra`}],images:[]},{id:`F17`,category:`fridge`,code:`(R017) Lỗi làm đá tự động -  Đá tự động không rơi xuống `,title:`Lỗi làm đá tự động -  Đá tự động không rơi xuống `,description:`Lỗi làm đá tự động -  Đá tự động không rơi xuống `,steps:[{text:`Bảng điều khiển của khách hàng có chớp đèn báo lỗi không (model tủ RT, RB)? Hoặc hiển thị lỗi E0/EP (model tủ RF,RS)`},{text:`Có : tư vấn KH rút điện, ghim lại, để theo dõi 15p, xem còn báo lỗi nữa không ?`},{text:`KH có đang bật chế độ làm đá tự động ? hiển thị ICE ON đang sáng không ? ( đặc biệt model GR-RS755WIA)`},{text:`Hộp nước đã được lắp đúng vị trí chưa ? Có nước trong hộp chứa nước không ? (lấy nước uống được ko?)`},{text:`Có => Tạo WO chuyển ASP kiểm tra`},{text:`Không => Chức năng làm đá đã được kích hoạt + nhiệt độ ngăn ĐÔNG  đã chỉnh mức lạnh nhất chưa?`}],images:[]},{id:`F18`,category:`fridge`,code:`(R018) Tủ có tiếng ồn bất thường`,title:`Tủ có tiếng ồn bất thường`,description:`Tủ có tiếng ồn bất thường`,steps:[{text:`Kiểm tra tủ đã được lắp đặt trên sàn chắc chắn chưa?`},{text:`Vị trí đặt tủ có gần giường ngủ ko?`},{text:`Kiểm tra các phụ kiện (ngăn, hộc, khay) có được lắp đặt đúng vị trí chưa?`},{text:`Hướng dẫn KH mở cửa tủ ra có còn nghe tiếng ồn nữa không?`},{text:`Có => Giải thích là do máy nén hoạt động`},{text:`Không => Do quạt gió chém vào đá nghe tiếng kêu lạch cạch. Nếu là TH này thì tạo WO chuyển ASP kiểm tra`}],images:[]},{id:`F19`,category:`fridge`,code:`(R019) Ngăn đông không lạnh`,title:`Ngăn đông không lạnh`,description:`Ngăn đông không lạnh`,steps:[{text:`Thuyết phục khách hàng kiểm tra lại bảng điều khiển đã điều chỉnh mức thấp nhất chưa? (Hỏi thăm KH đang chỉnh nhiệt độ mức nào?)`},{text:`Thực phẩm đã khách hàng trữ có cản trở luồng gió lạnh thổi ra không?`},{text:`Nếu không khắc phục được. Báo ASP kiểm tra`}],images:[]},{id:`F20`,category:`fridge`,code:`(R020) Không nguồn`,title:`Tủ lạnh Không nguồn`,description:`Tủ lạnh Không nguồn`,steps:[{text:`Kiểm tra ổ cắm điện có nguồn không? Phích dây nguồn đã được cắm chặt vào ổ cắm điện chưa?`},{text:`Nếu ổ cắm điện có nguồn. Mở ngăn mát ra mà đèn không sáng. Hoặc Bảng điều khiển không sáng`},{text:`Báo ASP kiểm tra`}],images:[]},{id:`F21`,category:`fridge`,code:`(R021) Đèn LED không sáng`,title:`Tủ lạnh Đèn LED không sáng, đèn LED trong ngăn mát hoặc ngăn đông không sáng`,description:`Tủ lạnh Đèn LED trong ngăn mát hoặc ngăn đông không sáng`,steps:[{text:`Kiểm tra ổ cắm điện có nguồn không? Phích dây nguồn đã được cắm chặt vào ổ cắm điện chưa?`},{text:`Kiểm tra lại máy nén có đang hoạt động không?`},{text:`Nếu có, báo MSC kiểm tra và xử lý cho KH`}],images:[]},{id:`F22`,category:`fridge`,code:`(R022) Tiếng kêu to từ máy nén`,title:`Tủ lạnh Tiếng kêu to từ máy nén`,description:`Tủ lạnh Tiếng kêu to từ máy nén`,steps:[{text:`Máy nén có thể kêu to hơn thông thường khi tủ làm lạnh với công suất cao trong trường hợp: sử dụng tủ lần đầu, tủ chưa đủ lạnh, đóng/mở cửa quá thường xuyên. Máy nén sẽ êm hơn khi tủ đã đủ lạnh`},{text:`Nếu không khắc phục được. Báo ASP kiểm tra`}],images:[]},{id:`F23`,category:`fridge`,code:`(R023) Tiếng kêu khác - âm thanh bình thường của tủ`,title:`Tủ lạnh Tiếng kêu khác - âm thanh bình thường của tủ`,description:`Tủ lạnh Tiếng kêu khác - âm thanh bình thường của tủ`,steps:[{text:`Âm thanh như tiếng nước chảy, tiếng sôi, tiếng lách tách. Đây là âm thanh của dòng chảy của môi chất lạnh (gas lạnh) trong hệ thống lạnh`},{text:`Âm thanh kêu lớn KH đang phản ánh là tiếng gas luân chuyển trong hệ thống dàn, thường thì sau khi chạy xả đá xong, tủ cần chạy lại công suất cao để giữ nhiệt lạnh cho thực phẩm, nên sẽ nghe tiếng gas rõ tiếng hơn trong vài phút và hết, đó là là tiếng vận hành của tủ không phải hư hỏng`},{text:`Tiếng lách tách. Đây là âm thanh của lớp nhựa bên trong tủ co dãn khi nhệt độ thay đổi (thông thường các tủ mới sẽ có)`},{text:` Nếu không khắc phục được. Báo ASP kiểm tra`}],images:[]},{id:`F24`,category:`fridge`,code:`(R024) Ngăn mát không lạnh`,title:`Tủ lạnh Ngăn mát không lạnh`,description:`Tủ lạnh Ngăn mát không lạnh`,steps:[{text:`Thuyết phục khách hàng kiểm tra lại bảng điều khiển đã điều chỉnh mức thấp nhất chưa?`},{text:`Thực phẩm đã khách hàng trữ có cản trở luồng gió lạnh thổi ra không?`},{text:` Nếu không khắc phục được. Báo ASP kiểm tra`}],images:[]},{id:`F25`,category:`fridge`,code:`(R025) Ngăn mát quá lạnh`,title:`Tủ lạnh Ngăn mát quá lạnh`,description:`Tủ lạnh Ngăn mát quá lạnh`,steps:[{text:`Nhiệt độ có đang cài đặt ở mức 'lạnh nhất' không?  => Chỉnh lại nhiệt độ trung bình/ cao nhất`},{text:`Có đặt thực phẩm sát các khe thoát khí lạnh? Thực phẩm sẽ dễ bị đông đá. => Giữ khoảng cách vừa đủ giữa các loại thực phẩm. Không chặn lỗ thông hơi lạnh`},{text:` Nếu không khắc phục được. Báo ASP kiểm tra`}],images:[]},{id:`F26`,category:`fridge`,code:`(R026) Ron cửa hít không chặt`,title:`Tủ lạnh Ron cửa hít không chặt`,description:`Tủ lạnh Ron cửa hít không chặt`,steps:[{text:`Trường hợp khách hàng mua hơn 3 tháng, khuyến nghị khách hàng vệ sinh lại ron cửa bằng nước ấm`},{text:`Điều chỉnh lại tủ cân bằng`},{text:`Kiểm tra lại ron cửa có bị gập không?`},{text:`Kiểm tra lại khay kệ có bị cấn thực phẩm trong tủ không?`},{text:`Nếu không khắc phục được. Báo ASP kiểm tra`}],images:[]},{id:`F27`,category:`fridge`,code:`(R027) Thời gian đông đá quá lâu`,title:`Tủ lạnh Thời gian đông đá quá lâu`,description:`Tủ lạnh Thời gian đông đá quá lâu`,steps:[{text:`TDV hỏi khách hàng số lượng lon đá làm cùng 1 lúc bao nhiêu lon?`},{text:`Khuyến nghị khách hàng làm từ 6-8 lon (tuỳ theo dung tích lon đá) sau khi lon đá đông sẽ làm thêm và xen kẽ`},{text:`Nếu không khắc phục được. Báo ASP kiểm tra`}],images:[]},{id:`F28`,category:`fridge`,code:`(R028) Tủ kém lạnh`,title:`Tủ lạnh kém lạnh`,description:`Tủ lạnh kém lạnh`,steps:[{text:`Thuyết phục khách hàng kiểm tra lại bảng điều khiển đã điều chỉnh mức nhiệt độ thấp nhất chưa?`},{text:`Thực phẩm đã khách hàng trữ có cản trở luồng gió lạnh thổi ra không?`},{text:`Tủ có đặt vị trí có ánh nắng chiếu tực tiếp vào tủ hoặc gần các thiết bị điện, nhiệt?`},{text:`Luôn chừa khoảng trống xung quanh để tủ làm lạnh hiệu quả: Trên 30cm, hông 10cm, sau 10cm (Lưu ý dòng JAPANDi sẽ nhỏ hơn)`},{text:`Nếu không khắc phục được. Báo ASP kiểm tra`}],images:[]},{id:`F29`,category:`fridge`,code:`(R029) Tủ gợn sóng bên hông tủ`,title:`Tủ lạnh gợn sóng bên hông tủ`,description:`Tủ lạnh gợn sóng bên hông tủ`,steps:[{text:`Đây không phải lỗi sản phẩm`},{text:`Dàn nóng được thiết kế đặt bên hông tủ đổ form cách nhiệt và ---
Làm khô chén đĩa của bạn với 3 tùy chọn. Đáp ứng các nhu cầu khác nhau, các chế độ này có thể được sử dụng sau khi chén đĩa đã được rửa sạch.

* **Làm ấm & Sấy khô 120 phút**
* **Rửa tráng & Sấy khô 100 phút**`},{id:`k3`,title:`Chức năng bảo quản máy rửa chén`,keywords:[`bảo quản`,`bao quan`,`storage`,`dw-15f7`,`dw-15f8`,`dw-15f9`],answer:`### CHỨC NĂNG BẢO QUẢN MÁY RỬA CHÉN
Dưới tác động của tuabin quạt, chức năng bảo quản có thể mang lại hiệu quả sấy tốt hơn và giữ không khí trong máy rửa chén luôn tươi mới.

* **Thời gian hoạt động:** Tối đa 168 giờ sau khi hoàn thành chương trình rửa.
* **Lưu ý:** Không thể sử dụng cùng lúc với chức năng *Auto Open* (Mở cửa tự động).
* **Chế độ hỗ trợ:** Tự động AI, Chuyên sâu, Tiết kiệm, 90 phút, Vệ sinh, Đồ thủy tinh, Khử trùng, Yên tĩnh...`},{id:`k4`,title:`Chức năng tăng tốc máy rửa chén`,keywords:[`tăng tốc`,`tang toc`,`tăng tôc`,`tang tôc`,`tăng toc`,`dw-15f7`,`dw-15f8`,`dw-15f9`],answer:`### 📌 TÍNH NĂNG TĂNG TỐC TRÊN MÁY RỬA CHÉN
---
Giảm thời gian chương trình. 

* **Chỉ sử dụng với các chế độ:** Chuyên sâu, Tiết kiệm, 90 phút, Đồ thủy tinh, Khử trùng, Yên tĩnh`},{id:`k5`,title:`Chức năng sấy tăng cường `,keywords:[`sấy tăng cường`,`tăng cường`,`sây tang cuong`,`DW-15F9(B)-VN`],answer:`### 📌 SẤY TĂNG CƯỜNG MÁY RỬA CHÉN DW-15F9(B)-VN
---
Để có kết quả sấy khô tốt hơn

* **Chương trình sử dụng:** Chức năng này chỉ có thể sử dụng với các chương trình Chuyên sâu, tiết kiệm, 90 phút, Đồ thủy tinh, Khử trùng.`},{id:`k6`,title:`Chức năng khoá trẻ em`,keywords:[`khoá trẻ em`,`khoa tre em`,`DW-15F9(B)-VN`,`child lock`,`lock`],answer:`### 📌 KHOÁ TRẺ EM DW-15F9(B)-VN
---
Chức năng này cho phép bạn khóa các nút trên bảng điều khiển, ngăn trẻ em vô tình khởi động máy rửa chén bằng cách nhấn các nút trên bảng điều khiển

- Chỉ nút Nguồn vẫn hoạt động. Để khóa hoặc mở khóa các nút trên bảng điều khiển, nhấn giữ nút này trong 3 giây.
`},{id:`k7`,title:`Màn hình hiển thị & Đèn báo biểu tượng`,keywords:[`man hinh hien thi DW-15F9(B)-VN`,`den bao DW-15F9(B)-VN`,`bieu tuong DW-15F9(B)-VN`,`den bao nuoc DW-15F9(B)-VN`,`den bao tro xa DW-15F9(B)-VN`,`den bao muoi DW-15F9(B)-VN`,`den h DW-15F9(B)-VN`],answer:`### 🖥️ MÀN HÌNH HIỂN THỊ & ĐÈN BÁO DW-15F9(B)-VN
---
Ý nghĩa các biểu tượng và đèn báo hiển thị trên bảng điều khiển:

* **[ 8:88 ] - Thời gian & Mã lỗi:** Khi chọn chương trình, màn hình hiển thị thời gian còn lại, thời gian hẹn giờ và mã lỗi (nếu có).
* **[ 🚰 ] - Đèn báo thiếu nước:** Cảnh báo nguồn nước cấp vào máy rửa chén đang bị thiếu hoặc chưa mở van nước.
* **[ ☀️ ] - Đèn báo nước trợ xả:** Đèn sáng báo hiệu máy rửa chén sắp hết nước trợ xả (Rinse Aid) và cần thêm vào.
* **[ 🔀 / S ] - Đèn báo muối:** Đèn sáng báo hiệu máy rửa chén sắp hết muối làm mềm nước (Salt) và cần thêm vào.
* **[ H ] - Đèn báo Bảo quản:** Đèn sáng hiển thị số giờ khi chức năng Bảo quản (Fresh) được chọn.`},{id:`k8`,title:`Chương trình Tải xuống & Chế độ rửa qua ứng dụng`,keywords:[`tai xuong`,`chuong trinh tai xuong`,`do thuy tinh`,`rua nhanh`,`ngam`,`khu trung`,`rua hai san`,`rua trai cay`,`ung dung`,`app`,`DW-15F9(B)-VN`],answer:`### 📲 CHƯƠNG TRÌNH TẢI XUỐNG & CHẾ ĐỘ RỬA QUA ỨNG DỤNG
---
Chương trình này bao gồm nhiều chế độ rửa có thể được chọn trong ứng dụng. Nếu chương trình rửa chưa được kích hoạt trong ứng dụng, chế độ **'Đồ thủy tinh'** sẽ được kích hoạt mặc định.

* **[ 🍷✨ ] - Đồ thủy tinh:** Dành cho chén đĩa và đồ thủy tinh bị bẩn nhẹ.
* **[ 🍷⏩ ] - Rửa nhanh:** Dành cho chén đĩa bẩn nhẹ, thời gian làm sạch tương đối ngắn.
* **[ 🚿 ] - Ngâm:** Để rửa chén đĩa mà bạn dự định rửa vào cuối ngày.
* **[ ♨️ / 72°C ] - Khử trùng:** Sử dụng để khử trùng chén đĩa và đồ thủy tinh của bạn. Nhiệt độ nước cao nhất là **72°C**.
* **[ 🦞 ] - Rửa hải sản:** Dùng để làm sạch hải sản, tôm hùm,...
* **[ 🍎 ] - Rửa trái cây:** Dùng để làm sạch trái cây, rau củ, vỏ,...`},{id:`k9`,title:`Các đèn báo chương trình rửa chính DW-15F9(B)-VN`,keywords:[`chuong trinh rua`,`den bao chuong trinh`,`tu dong ai`,`chuyen sau`,`tiet kiem`,`eco`,`90 phut`,`ve sinh`,`DW-15F9(B)-VN`],answer:`### 🍽️ CÁC ĐÈN BÁO CHƯƠNG TRÌNH RỬA CHÍNH
---
Ý nghĩa các biểu tượng chương trình rửa chính trên bảng điều khiển:

* **[ Ⓐ ] - Tự động AI:** Dành cho các đồ dùng hàng ngày từ ít đến nhiều vết bẩn, với khả năng tự động phát hiện lượng bẩn.
* **[ 🍳 ] - Chuyên sâu:** Dành cho chén đĩa có vết dầu mỡ và dụng cụ nấu ăn bẩn nhiều.
* **[ eco ] - Tiết kiệm:** Đây là chương trình tiêu chuẩn. Dành cho chén đĩa và dụng cụ bếp bẩn thông thường (như nồi, đĩa, ly, chảo).
* **[ 🕒90' ] - 90 phút:** Đối với vật dụng bẩn thông thường cần rửa nhanh.
* **[ ✨ ] - Vệ sinh:** Chương trình này giúp làm sạch bên trong máy rửa chén một cách hiệu quả.`},{id:`k10`,title:`Chức năng Rửa nửa tải (½) DW-15F9(B)-VN`,keywords:[`rua nua tai`,`nua tai`,`half load`,`1/2`,`tiet kiem dien nuoc`,`DW-15F9(B)-VN`],answer:`### 🍽️ CHỨC NĂNG RỬA NỬA TẢI (½)
---
Khi bạn có khoảng hoặc ít hơn một nửa số chén đĩa để rửa, bạn có thể chọn chức năng này để tiết kiệm điện và nước.

* **Biểu tượng hiển thị:** **[ ½ ]**
* **Lưu ý chương trình áp dụng:** Chức năng này chỉ có thể sử dụng với các chương trình *Chuyên sâu*, *Tiết kiệm*, *90 phút*, *Đồ thủy tinh*, *Khử trùng*.`},{id:`k11`,title:`Hướng dẫn Kết nối mạng Wi-Fi & Ứng dụng DW-15F9(B)-VN`,keywords:[`ket noi wifi`,`wifi`,`ket noi mang`,`internet`,`khong day`,`ket noi app`,`ung dung`,`DW-15F9(B)-VN`],answer:`### 📶 KẾT NỐI MẠNG INTERNET KHÔNG DÂY (WI-FI)
---
Hướng dẫn thao tác kết nối máy rửa chén với ứng dụng điều khiển qua Wi-Fi:

* **Thao tác kích hoạt:** Nhấn giữ nút Wi-Fi **[ 📶 ]** trong **hơn 3 giây**.

Hướng dẫn thao tác các bước khởi động và vận hành máy:

* **Bước 1 (Nguồn điện):** Cắm phích cắm vào ổ điện. Yêu cầu nguồn điện **220-240V AC 50Hz**, ổ điện chịu tải **10A**.
* **Bước 2 (Nguồn nước):** Đảm bảo nguồn cung cấp nước đã được mở/bật ở áp suất tối đa.
* **Bước 3 (Bật nguồn):** Nhấn nút **Nguồn [ ⑼ ]** để bật máy rửa chén.
* **Bước 4 (Chọn chương trình):** Nhấn các nút **[ < ]** và **[ > ]** để chọn chương trình rửa; đèn báo tương ứng sẽ sáng lên (Tự động AI, Chuyên sâu, Tiết kiệm...).
* **Bước 5 (Bắt đầu):** Nhấn nút **Bắt đầu/Tạm dừng [ ▷❚❚ ]** để máy bắt đầu vận hành.`},{id:`k14`,title:`Hướng dẫn Thay đổi chương trình giữa chu trình DW-15F9(B)-VN`,keywords:[`thay doi chuong trinh`,`doi chuong trinh`,`huy chuong trinh`,`reset chuong trinh`,`tam dung`,`giu 3s`,`DW-15F9(B)-VN`],answer:`### 🔄 THAY ĐỔI CHƯƠNG TRÌNH GIỮA CHU TRÌNH
---
**Lưu ý quan trọng:** Một chương trình chỉ có thể được thay đổi nếu chương trình chỉ vừa chạy trong thời gian ngắn. Nếu đã chạy lâu, dung dịch/viên rửa chén có thể đã được giải phóng hoặc nước rửa đã bị xả. Khi đó, cần đặt lại máy và cho thêm viên rửa vào ngăn đựng.

* **Bước 1 (Tạm dừng):** Nhấn nút **Bắt đầu/Tạm dừng [ ▷❚❚ ]** để tạm dừng chu trình rửa hiện tại.
* **Bước 2 (Hủy chương trình):** Nhấn giữ nút **Bắt đầu/Tạm dừng [ ▷❚❚ ]** trong **hơn 3 giây**, máy rửa chén sẽ hủy chương trình cũ và chuyển vào chế độ chờ.
* **Bước 3 (Chọn lại):** Nhấn các nút **[ < ]** và **[ > ]** để chọn chương trình rửa mới mong muốn.
* **Bước 4 (Khởi động lại):** Nhấn nút **Bắt đầu/Tạm dừng [ ▷❚❚ ]** để máy chạy chương trình mới.`},{id:`k15`,title:`Hướng dẫn Thêm chén đĩa trong quá trình rửa DW-15F9(B)-VN`,keywords:[`them chen dia`,`them do`,`bo sung chen dia`,`bo them do`,`cho them do`,`mo cua giua chung`,`DW-15F9(B)-VN`],answer:`### 🍽️ HƯỚNG DẪN THÊM CHÉN ĐĨA TRONG QUÁ TRÌNH RỬA
---
Chén đĩa bổ sung có thể được đặt thêm vào bất kỳ lúc nào trước khi chương trình rửa bắt đầu. Nếu muốn thêm chén đĩa trong quá trình máy đang rửa, hãy thao tác theo các bước sau:

* **Bước 1 (Tạm dừng):** Nhấn nút **Bắt đầu/Tạm dừng [ ▷❚❚ ]** để tạm dừng chương trình rửa.
* **Bước 2 (Mở cửa):** Chờ **5 giây** rồi mới tiến hành mở cửa máy rửa chén.
* **Bước 3 (Thêm đồ):** Đặt thêm chén đĩa cần rửa vào các giá cống.
* **Bước 4 (Đóng cửa):** Đóng chặt cửa máy rửa chén lại.
* **Bước 5 (Tiếp tục):** Nhấn nút **Bắt đầu/Tạm dừng [ ▷❚❚ ]**, sau **10 giây** máy rửa chén sẽ tự động bắt đầu chạy tiếp.`},{id:`k16`,title:`Hướng dẫn Kết thúc chương trình rửa & Lưu ý an toàn DW-15F9(B)-VN`,keywords:[`ket thuc chuong trinh`,`rua xong`,`hien thi end`,`tat may`,`mo cua`,`lay chen dia`,`canh bao an toan`,`nuoc nong`,`bong nuoc`,`DW-15F9(B)-VN`],answer:`### 🔔 KẾT THÚC CHƯƠNG TRÌNH RỬA & LƯU Ý AN TOÀN
---
Sau khi chương trình kết thúc, máy sẽ hiển thị **"End"** trên màn hình và phát ra âm báo trong **8 giây**.

* **1. Tắt máy:** Nhấn nút **Nguồn [ ⑼ ]** để tắt máy rửa chén.
* **2. Mở cửa cẩn thận:** Chén đĩa khi vừa rửa xong còn rất nóng và dễ bị hỏng hơn. Cần để nguội khoảng **15 phút** trước khi lấy ra khỏi máy.
* **3. Trạng thái sau rửa:** Việc bên trong lòng máy rửa chén vẫn còn ướt là hoàn toàn bình thường.

⚠️ **CẢNH BÁO AN TOÀN:**
*Việc mở cửa trong quá trình máy đang rửa là cực kỳ nguy hiểm vì có thể gây bỏng nghiêm trọng do nước nóng.*`},{id:`k17`,title:`Hướng dẫn Bộ làm mềm nước máy rửa chén DW-15F9(B)-VN`,keywords:[`bo lam mem nuoc`,`lam mem nuoc`,`do cung cua nuoc`,`nuoc cung`,`chinh do cung`,`num xoay`,`khoang chat`,`DW-15F9(B)-VN`],answer:`### 💧 SỬ DỤNG MÁY RỬA CHÉN - BỘ LÀM MỀM NƯỚC
---
Thông tin chi tiết về nguyên lý và cách cài đặt bộ làm mềm nước:

* **Cách cài đặt:** Bộ làm mềm nước phải được cài đặt bằng tay, bằng cách sử dụng núm xoay để điều chỉnh.
* **Chức năng chính:** Bộ làm mềm nước được thiết kế để loại bỏ các khoáng chất và muối khỏi nước, tránh những tác động có hại hoặc bất lợi đến hoạt động của thiết bị.
* **Độ cứng của nước:** Càng có nhiều khoáng chất, nước của bạn càng cứng.
* **Khuyên dùng:** Bộ làm mềm nước nên được điều chỉnh theo độ cứng của nước tại khu vực của bạn. Cơ quan Cấp nước địa phương có thể tư vấn cho bạn về độ cứng của nước trong khu vực.`},{id:`k18`,title:`Hướng dẫn Điều chỉnh mức tiêu thụ muối DW-15F9(B)-VN`,keywords:[`dieu chinh muc tieu thu muoi`,`chinh muoi`,`cai dat muoi`,`muc muoi`,`chinh do cung nuoc`,`h1`,`h2`,`h3`,`h4`,`h5`,`h6`,`DW-15F9(B)-VN`],answer:`### 🧂 ĐIỀU CHỈNH MỨC TIÊU THỤ MUỐI
---
Máy rửa chén cho phép điều chỉnh lượng muối tiêu thụ dựa trên độ cứng của nước được sử dụng nhằm tối ưu hóa hiệu quả rửa.

* **Bước 1 (Bật máy):** Đóng cửa máy rửa chén và nhấn bật thiết bị.
* **Bước 2 (Vào cài đặt):** Trong vòng **60 giây** sau khi bật máy, nhấn giữ nút **[ > ]** trong **hơn 5 giây** để vào chế độ cài đặt bộ làm mềm nước.
* **Bước 3 (Chọn mức H):** Nhấn nút **[ > ]** từng lần một để chọn cài đặt phù hợp với độ cứng nước tại địa phương. Trình tự thay đổi mức như sau:
  \`H3 ➔ H4 ➔ H5 ➔ H6 ➔ H1 ➔ H2 ➔ H3\`
* **Bước 4 (Lưu & Thoát):** Không thao tác trong **5 giây** hoặc nhấn nút **Nguồn [ ⑼ ]** để hoàn tất thiết lập và thoát khỏi chế độ cài đặt.`},{id:`k19`,title:`Bảng tra cứu Độ cứng của nước & Cấp độ H1-H6 DW-15F9(B)-VN`,keywords:[`bang do cung nuoc`,`tra cuu do cung nuoc`,`cap do lam mem nuoc`,`h1`,`h2`,`h3`,`h4`,`h5`,`h6`,`dh`,`fh`,`clarke`,`mmol/l`,`luong muoi tieu thu`,`chu trinh tai tao`,`DW-15F9(B)-VN`],answer:`### 🧪 BẢNG TRA CỨU ĐỘ CỨNG NƯỚC & MỨC MUỐI (H1 - H6)

---
⚠️ **CẢNH BÁO QUAN TRỌNG:**
* **Loại muối:** Chỉ sử dụng muối chuyên dụng cho máy rửa chén. *Không dùng muối ăn* vì sẽ làm hỏng hóc khoáng/bộ làm mềm nước (trường hợp này sẽ không được bảo hành).
* **Thời điểm đổ:** Chỉ đổ đầy muối ngay *trước khi bắt đầu một chu trình rửa* để tránh nước mặn bị đọng lại gây ăn mòn lòng máy.

📝 **CÁC BƯỚC THỰC HIỆN:**
* **Bước 1:** Tháo giỏ dưới và vặn mở nắp khoang chứa muối.
* **Bước 2:** Đặt phần cuối của phễu vào lỗ và đổ vào khoảng **1,5 kg** muối rửa chén chuyên dụng.
* **Bước 3:** Đổ thêm nước đến giới hạn tối đa vào khoang chứa muối (một lượng nhỏ nước trào ra ngoài là hoàn toàn bình thường).
* **Bước 4:** Sau khi đổ đầy, hãy vặn chặt nắp lại.
* **Bước 5:** Đèn cảnh báo muối sẽ tự động tắt sau khi khoang chứa được đổ đầy.
* **Bước 6 (Bắt buộc):** Ngay sau khi đổ muối xong, cần chạy ngay một chương trình rửa (nên chọn chương trình ngắn). Nếu không, nước mặn trào ra có thể làm hỏng hệ thống lọc, bơm hoặc linh kiện khác (không thuộc phạm vi bảo hành).

📌 **CHÚ Ý BỔ SUNG:**
* Chỉ bổ sung muối khi **đèn cảnh báo muối [ 🔀 / S ]** trên bảng điều khiển sáng. Tùy thuộc vào mức độ hòa tan của muối, đèn báo có thể *vẫn sáng dù khoang chứa đã được đổ đầy*.
* Nếu model máy không có đèn báo muối, bạn có thể ước lượng thời điểm bổ sung dựa trên số chu trình rửa máy đã chạy.
* Nếu muối bị đổ/vương vãi ra ngoài lòng máy, hãy chạy chương trình **Ngâm** hoặc **Rửa nhanh** ngay lập tức để loại bỏ sạch muối.`},{id:`k21`,title:`Chức năng của Nước trợ xả & Viên/Dung dịch rửa chén DW-15F9(B)-VN`,keywords:[`nuoc tro xa`,`chat tro xa`,`dung dich rua`,`vien rua`,`chat tay rua`,`bong chen dia`,`sot nuoc`,`den bao tro xa`,`canh bao vien rua`,`an mon`,`DW-15F9(B)-VN`],answer:`### 💧 CHỨC NĂNG NƯỚC TRỢ XẢ & VIÊN / DUNG DỊCH RỬA CHÉN
---
📌 **1. CHỨC NĂNG CỦA NƯỚC TRỢ XẢ (RINSE AID):**
* **Nguyên lý:** Nước trợ xả được xả vào máy trong lần rửa cuối cùng để ngăn nước hình thành các giọt nhỏ trên bát đĩa (tránh để lại vết đốm, vệt mờ).
* **Hiệu quả sấy:** Cải thiện đáng kể quá trình sấy khô nhờ làm nước không bám lại trên bề mặt chén đĩa.
* **Dạng sử dụng:** Máy được thiết kế để sử dụng loại nước trợ xả dạng lỏng.

⚠️ **CẢNH BÁO NƯỚC TRỢ XẢ:** Tuyệt đối không đổ bất kỳ chất nào khác (như nước rửa chén thông thường, chất tẩy rửa dạng lỏng khác) vào ngăn chứa nước trợ xả vì sẽ làm hỏng thiết bị.

⏰ **THỜI ĐIỂM BỔ SUNG NƯỚC TRỢ XẢ:**
* **Dấu hiệu:** Đèn báo nước trợ xả còn ít **[ ☀️ ]** sẽ xuất hiện trên màn hình hiển thị.
* **Lưu ý:** Không đổ quá đầy vượt mức giới hạn vào ngăn chứa.

🧪 **2. CHỨC NĂNG CỦA DUNG DỊCH / VIÊN RỬA CHÉN:**
* Các thành phần hóa học trong dung dịch/viên rửa chén chuyên dụng là bắt buộc để loại bỏ, phá vỡ và tẩy trôi hoàn toàn các vết bẩn, dầu mỡ.
* Hầu hết các loại dung dịch/viên rửa chén thương mại chất lượng cao đều phù hợp sử dụng.

⚠️ **CẢNH BÁO SỬ DỤNG VIÊN/DUNG DỊCH RỬA CHÉN:**
* **Sử dụng đúng cách:** Chỉ sử dụng loại được sản xuất riêng cho máy rửa chén. Bảo quản dung dịch/viên rửa sạch và khô ráo. *Không đổ vào ngăn chứa cho đến khi bạn sẵn sàng sử dụng máy rửa chén*.
* **An toàn trẻ em:** Dung dịch/viên rửa chén dùng cho máy rửa chén **có tính ăn mòn**! Tuyệt đối để xa tầm tay trẻ em.`},{id:`k22`,title:`Hướng dẫn Điều chỉnh mức tiêu thụ nước trợ xả DW-15F9(B)-VN`,keywords:[`dieu chinh nuoc tro xa`,`chinh tro xa`,`cai dat tro xa`,`d1`,`d2`,`d3`,`d4`,`d5`,`muc tro xa`,`tang tro xa`,`DW-15F9(B)-VN`],answer:`### 💧 ĐIỀU CHỈNH NGĂN CHỨA NƯỚC TRỢ XẢ
---
Điều chỉnh lượng nước trợ xả vừa phải giúp tối ưu hóa hiệu quả sấy khô bát đĩa:

* **Bước 1 (Bật máy):** Đóng cửa và nhấn bật nguồn máy rửa chén.
* **Bước 2 (Vào cài đặt):** Trong vòng **60 giây** sau bước 1, nhấn giữ nút **[ > ]** trong **hơn 5 giây**, sau đó nhấn nút **Hẹn Giờ** để vào chế độ cài đặt. Đèn báo nước trợ xả sẽ nhấp nháy với tần số 1 Hz.
* **Bước 3 (Chọn mức d):** Nhấn nút **[ > ]** để chọn mức cài đặt phù hợp. Các cài đặt sẽ thay đổi theo trình tự:
  \`d3 ➔ d4 ➔ d5 ➔ d1 ➔ d2 ➔ d3\`
  *(Lưu ý: Số càng cao, máy rửa chén càng sử dụng nhiều nước trợ xả. Cài đặt mặc định của nhà máy là **d3**).* 
* **Bước 4 (Lưu & Thoát):** Nếu không thao tác trong vòng **5 giây** hoặc nhấn nút **Nguồn [ ⑼ ]**, chế độ cài đặt sẽ tự động thoát và được lưu thành công.`},{id:`k23`,title:`Hướng dẫn Xếp chén đĩa & Vật dụng phù hợp DW-15F9(B)-VN`,keywords:[`xep chen dia`,`vat dung phu hop`,`khong phu hop`,`han che su dung`,`do go`,`do nhua`,`do thuy tinh`,`dao keo`,`DW-15F9(B)-VN`],answer:`### 🍽️ XẾP CHÉN ĐĨA VÀO GIỎ & PHÂN LOẠI VẬT DỤNG
---
💡 **GỢI Ý TỔNG QUAN:**
* Nên chọn mua loại chén đĩa được chứng nhận dùng được cho máy rửa chén.
* Sử dụng loại viên rửa chén nhẹ phù hợp (tham khảo thêm thông tin nhà sản xuất).
* Đối với các thiết bị/đồ dùng đặc biệt, hãy ưu tiên chọn chương trình rửa với nhiệt độ thấp hơn.
* Không lấy ngay các vật dụng bằng thủy tinh ra ngoài khi chu trình vừa kết thúc để tránh hư hỏng do sốc nhiệt.

⚠️ **SỬ DỤNG MÁY RỬA CHÉN MỘT CÁCH HỢP LÝ:**

❌ **1. Không phù hợp cho máy rửa chén (Tránh rửa):**
* Dụng cụ bằng gỗ, sừng, sứ hoặc cán ngọc trai.
* Sản phẩm nhựa không chịu nhiệt.
* Dao cắt không chịu nhiệt hoặc có các bộ phận dính bằng keo không chịu được nhiệt.
* Dao hoặc chén đĩa bị gắn với nhau theo khối.
* Dụng cụ bằng thiếc hoặc đồng.
* Thủy tinh pha lê.
* Sản phẩm thép dễ bị rỉ sét.
* Dụng cụ bằng gỗ và các sản phẩm làm từ sợi tổng hợp.

⚠️ **2. Hạn chế sử dụng (Cần lưu ý):**
* **Đồ thủy tinh:** Sau vài lần rửa, một số đồ thủy tinh có thể trở nên mờ đục.
* **Đồ bạc / Nhôm:** Sản phẩm bằng bạc hoặc nhôm thường bị đổi màu trong quá trình rửa.
* **Hoa văn trang trí:** Màu sắc hoa văn của chén đĩa có thể bị phai đi nếu rửa thường xuyên.`},{id:`k24`,title:`Lưu ý trước và sau khi xếp chén đĩa vào giỏ DW-15F9(B)-VN`,keywords:[`luu y xep chen dia`,`truoc va sau khi xep`,`can thuc an`,`trang chen dia`,`dat up`,`dat nghieng`,`canh phun nuoc`,`dao dai`,`dao sac`,`DW-15F9(B)-VN`],answer:`### 🍽️ LƯU Ý TRƯỚC VÀ SAU KHI XẾP CHÉN ĐĨA VÀO GIỎ
---
💡 **1. SƠ CHẾ TRƯỚC KHI XẾP ĐỒ:**
* **Loại bỏ cặn thức ăn lớn:** Gạt bỏ cặn bẩn, thức ăn thừa kích thước lớn vào thùng rác.
* **Xử lý đồ cháy khát:** Làm mềm các cặn thức ăn cháy còn bám chặt trên chảo/nồi.
* **Không cần tráng nước:** *Không cần phải tráng chén đĩa bằng nước trước* khi xếp vào máy.

📝 **2. QUY TẮC XẾP ĐỒ VÀO MÁY:**
* **Đặt úp:** Cốc, ly, nồi,... có phần rỗng cần được đặt úp xuống để nước không bị đọng lại trong lòng vật dụng hoặc các khe.
* **Đặt nghiêng:** Đối với các dụng cụ có hình cong, lõm hoặc lồi, hãy đặt nghiêng để nước có thể tự chảy thoát ra ngoài.
* **Cố định an toàn:** Tất cả các dụng cụ phải được đặt cố định an toàn, không được để lỏng lẻo dễ đổ.
* **Tránh cản tay phun:** Đặt vật dụng sao cho các cánh tay phun nước có thể xoay tự do không bị vướng/cản trở.
* **Không chồng lấp:** Chén đĩa và dao không được đặt lồng vào trong các dụng cụ khác và không được xếp chồng lên nhau.
* **Khoảng cách đồ thủy tinh:** Không đặt các đồ thủy tinh nằm sát chạm vào nhau để tránh va đập hư hỏng.
* **An toàn với dao kéo:** *Đặt đứng dao dài là rất nguy hiểm!* Các loại dao dài hoặc dao sắc (như dao chặt thịt) nên được đặt **nằm ngang** trong giỏ.
* **Không xếp quá tải:** Không làm quá tải máy rửa chén để đảm bảo đạt hiệu quả làm sạch tốt nhất.

⚠️ **CHÚ Ý:** Các vật dụng nhỏ dễ rơi rớt ra khỏi khe giỏ thì **không nên** đặt trong máy rửa chén.`},{id:`k25`,title:`Hướng dẫn Vệ sinh & Bảo dưỡng bộ lọc DW-15F9(B)-VN`,keywords:[`ve sinh bo loc`,`bao duong bo loc`,`he thong loc`,`rua bo loc`,`tac nghen`,`rac tho`,`ve sinh may rua chen`,`DW-15F9(B)-VN`],answer:`### 🧽 VỆ SINH VÀ BẢO DƯỠNG - VỆ SINH BỘ LỌC
---
📌 **VAI TRÒ CỦA HỆ THỐNG BỘ LỌC:**
* **Vị trí:** Hệ thống lọc nằm ở phần đáy của khoang rửa.
* **Chức năng:** Giữ lại các mảnh vụn thô từ chu trình rửa (như tăm, mảnh vỡ, cặn thức ăn lớn) để tránh làm tắc nghẽn đường xả.
* **Khuyên dùng:** Thường xuyên kiểm tra tình trạng bộ lọc, cẩn thận loại bỏ các vật thể lạ và rửa sạch các phần của hệ thống lọc bằng nước chảy.

⚠️ **CẢNH BÁO KHI LẮP RÁP BỘ LỌC:**
* **Lực siết:** Không siết quá chặt các bộ lọc. Cần đặt các bộ lọc trở lại theo đúng trình tự an toàn, tránh để mảnh vụn to xâm nhập gây tắc nghẽn hệ thống bơm.
* **Lắp đặt bắt buộc:** *Tuyệt đối không sử dụng máy rửa chén khi chưa lắp bộ lọc*. Việc lắp bộ lọc sai cách hoặc không đúng vị trí có thể làm giảm hiệu suất rửa và gây hư hỏng chén đĩa, dụng cụ.`},{id:`k26`,title:`Hướng dẫn Bảo dưỡng & Bảo trì cửa, ron cửa và bảng điều khiển DW-15F9(B)-VN`,keywords:[`bao duong`,`bao tri`,`ve sinh cua`,`ron cua`,`gioang cua`,`bang dieu khien`,`den chieu sang`,`chat tay rua`,`trai xuoc`,`DW-15F9(B)-VN`],answer:`### 🛠️ BẢO DƯỠNG VÀ BẢO TRÌ MÁY RỬA CHÉN
---
📌 **1. CỬA VÀ RON CỬA:**
* Vệ sinh ron cửa thường xuyên bằng vải mềm ẩm để loại bỏ cặn thức ăn.
* Cặn thức ăn/đồ uống rơi xuống hai bên cửa nằm ngoài khoang rửa nên cánh phun nước không thể làm sạch tới. Cần lau sạch mọi cặn bẩn trước khi đóng cửa.

📌 **2. BẢNG ĐIỀU KHIỂN:**
* Lau bằng khăn hơi ẩm và đảm bảo bảng điều khiển khô hoàn toàn sau khi vệ sinh.
* Không dùng dụng cụ sắc nhọn, miếng chùi xước hoặc chất tẩy rửa mạnh ở bất kỳ đâu trong máy.

⚠️ **CẢNH BÁO BẢO TRÌ BỀ MẶT:**
* **Cửa máy:** Không dùng chất tẩy rửa dạng phun để làm sạch cửa vì có thể làm hỏng khóa cửa và các linh kiện điện.
* **Bề mặt inox:** Không dùng chất mài mòn hoặc khăn giấy thô vì dễ để lại vết xước trên bề mặt thép không gỉ.

💡 **3. ĐÈN CHIẾU SÁNG:**
* Đèn chiếu sáng không cần vệ sinh thêm.
* Nếu đèn bị vỡ trong quá trình sử dụng, hãy **ngắt nguồn điện** ngay lập tức và liên hệ kỹ thuật viên có chuyên môn để làm sạch và thay thế.`},{id:`k27`,title:`Cảnh báo An toàn về Điện & Trẻ em DW-15F7(G)-VN`,keywords:[`an toan`,`dien giat`,`tre em`,`rut phich cam`,`phich cam`,`DW-15F7(G)-VN`],answer:`### ⚠️ AN TOÀN ĐIỆN & TRẺ EM
---
* **Trẻ em:** Không để trẻ chơi đùa với máy. Vật liệu đóng gói có thể gây nguy hiểm cho trẻ.
* **Nguồn điện:** Dùng đúng công suất ghi trên nhãn. Rút phích cắm trước khi vệ sinh/bảo dưỡng.
* **Chống giật:** Không chạm phích cắm bằng tay ướt. Không dùng dây nguồn/ổ cắm bị hỏng.`},{id:`k28`,title:`Cảnh báo An toàn về Nhiệt & Bỏng DW-15F7(G)-VN`,keywords:[`nguy co bong`,`nuoc nong`,`khi nong`,`nhiet do`,`DW-15F7(G)-VN`],answer:`### ⚠️ CẢNH BÁO NGUY CƠ BỎNG
---
* **Bên trong khoang:** Không chạm vào khoang máy hoặc cánh phun trong và sau 30 phút vận hành.
* **Mở cửa:** Mở cửa khi máy đang chạy rất nguy hiểm vì nước nóng có thể gây bỏng nghiêm trọng.
* **Khí nóng:** Không lại gần khu vực ống xả vì hơi nước/không khí nóng thoát ra có thể gây bỏng.`},{id:`k29`,title:`Lưu ý Lắp đặt & Nối đất an toàn DW-15F7(G)-VN`,keywords:[`lap dat`,`noi dat`,`vi tri đặt máy`,`nguon nhiet`,`DW-15F7(G)-VN`],answer:`### 🛠️ LƯU Ý LẮP ĐẶT & NỐI ĐẤT
---
* **Nối đất:** Bắt buộc nối đất đúng cách. Nếu gặp lỗi **E3**, rút phích cắm và gọi thợ điện/KTV.
* **Vị trí:** Đặt máy trên bề mặt chắc chắn, bằng phẳng, dễ thoát nước và cách bếp gas/nguồn nhiệt ít nhất 15cm.
* **Không chất đồ:** Không đặt vật nặng, vật nóng hay đồ điện lên trên máy.`},{id:`k30`,title:`Danh sách Phụ kiện & Chất liệu Bao bì DW-15F7(G)-VN`,keywords:[`bo phan`,`phu kien`,`bao bi`,`tai che`,`DW-15F7(G)-VN`],answer:`### 📦 CÁC BỘ PHẬN & BAO BÌ
---
* **Cấu tạo:** Đèn UV, giỏ trên, giỏ dưới, giỏ dao kéo, giỏ trái cây, 3 cánh phun (trên/giữa/dưới), bộ lọc, ngăn muối, ngăn rửa.
* **Bao bì tái chế:** PE (túi), PS (xốp), POM (kẹp), ABS (bảng điều khiển), PP (khoang trong). Hãy gửi đến trung tâm tái chế.`},{id:`k31`,title:`Bảng điều khiển: Nút Nguồn, Chọn chương trình & Hẹn giờ DW-15F7(G)-VN`,keywords:[`nut nguon`,`chon chuong trinh`,`hen gio`,`bat may`,`tat may`,`DW-15F7(G)-VN`],answer:`### 🎛️ NÚT NGUỒN, CHƯƠNG TRÌNH & HẸN GIỜ
---
* **[ Nguồn ]:** Nhấn để bật hoặc tắt máy.
* **[ Chương trình (< / >) ]:** Nhấn \`<\` hoặc \`>\` để chọn chương trình rửa.
* **[ Hẹn giờ ]:** Đặt thời gian lùi khởi động lên đến 24 giờ (mỗi lần nhấn tăng 1 giờ).`},{id:`k32`,title:`Bảng điều khiển: Bắt đầu/Hủy & Chọn giàn rửa DW-15F7(G)-VN`,keywords:[`bat dau`,`huy chuong trinh`,`chon gian rua`,`gio tren`,`gio duoi`,`DW-15F7(G)-VN`],answer:`### 🎛️ NÚT BẮT ĐẦU, HỦY & CHỌN GIÀN RỬA
---
* **[ Bắt đầu/Hủy ]:** Nhấn để bắt đầu. Nhấn giữ **3 giây** để hủy chương trình đang chọn.
* **[ Chọn giàn rửa ]:** Tùy chọn chỉ rửa giỏ trên hoặc chỉ rửa giỏ dưới để tiết kiệm điện nước khi rửa ít đồ.`},{id:`k33`,title:`Tính năng Sấy Khí nóng & Bảo quản 168h DW-15F7(G)-VN`,keywords:[`khi nong`,`say khi nong`,`bao quan`,`168h`,`khong khi trong lanh`,`DW-15F7(G)-VN`],answer:`### ♨️ TÍNH NĂNG KHÍ NÓNG & BẢO QUẢN
---
* **Khí nóng:** 3 tùy chọn sấy khô sau rửa (Làm mới 60p, Làm ấm 120p, Rửa tráng & Sấy 100p).

* **Thêm chén đĩa:** Mở hé cửa chờ tay phun dừng ➔ Mở cửa cho thêm đồ ➔ Đóng cửa lại, máy tự chạy tiếp sau 10 giây.`},{id:`k62`,title:`Màn hình Hiển thị Biểu tượng & Mã thông báo DW-15F8(B)-VN`,keywords:[`den bao nuoc`,`den bao muoi`,`bieu tuong h`,`man hinh`,`DW-15F8(B)-VN`],answer:`### 🖥️ CÁC ĐÈN BÁO TRÊN MÀN HÌNH

* **Màn hình hiện "End":** Báo chương trình rửa đã kết thúc.`},{id:`k63`,title:`Cách Điều chỉnh Giỏ trên & Gấp giá đỡ DW-15F8(B)-VN`,keywords:[`dieu chinh gio tren`,`nang gio`,`ha gio`,`gap gia do`,`DW-15F8(B)-VN`],answer:`### 🧺 NÂNG HẠ GIỎ TREN & GẤP GIÁ ĐỠ

* **Hạ giỏ trên:** Nâng tay cầm điều chỉnh hai bên để thả giỏ xuống vị trí thấp hơn.
* **Gấp gai giỏ dưới:** Hạ các gai giữ đĩa xuống để tạo khoảng trống cho nồi chảo lớn.`},{id:`k64`,title:`Vệ sinh Cánh phun nước phía Trên & Dưới DW-15F8(B)-VN`,keywords:[`ve sinh tay phun`,`canh phun nuoc`,`tac lo phun`,`DW-15F8(B)-VN`],answer:`### 🧽 VỆ SINH CÁNH PHUN NƯỚC
---
* **Cánh phun trên:** Giữ chặt đai ốc ở giữa, xoay ngược chiều kim đồng hồ để tháo.
* **Cánh phun dưới:** Kéo thẳng cánh phun lên trên để tháo.
* **Làm sạch:** Rửa bằng nước ấm pha xà phòng, dùng bàn chải mềm làm sạch các lỗ phun bị tắc.`},{id:`k65`,title:`Vệ sinh Cửa, Ron cửa & Đèn chiếu sáng DW-15F8(B)-VN`,keywords:[`ron cua`,`ve sinh cua`,`den chieu sang`,`khi vo den`,`DW-15F8(B)-VN`],answer:`### 🧽 BẢO TRÌ CỬA & ĐÈN CHIẾU SÁNG
---
* **Ron cửa:** Lau sạch cặn thức ăn bằng vải mềm ẩm. Cần lau cả hai bên mép cửa ngoài khoang rửa.
* **Đèn chiếu sáng:** Không cần vệ sinh thêm. Nếu bóng bị vỡ, ngắt điện ngay và yêu cầu kỹ thuật viên thay thế.`},{id:`k66`,title:`Yêu cầu Nguồn nước cấp & Đường thoát nước DW-15F8(B)-VN`,keywords:[`ap luc nuoc`,`ong cap nuoc`,`ong thoat nuoc`,`chieu cao ong xa`,`DW-15F8(B)-VN`],answer:`### 🚰 YÊU CẦU NƯỚC CẤP & THOÁT
---
* **Áp lực nước:** Tối thiểu 0,04 MPa - Tối đa 1,0 MPa. Sử dụng ống cấp nước mới đi kèm.
* **Ống thoát nước:** Đường kính tối thiểu 4cm, chiều cao đường xả **thấp hơn 1000mm (1m)**. Không ngâm đầu xả trong nước. Độ dài nối thêm tối đa **4 mét**.`},{id:`k67`,title:`Sự cố: Máy không khởi động hoặc Không bơm thoát nước DW-15F8(B)-VN`,keywords:[`may khong chay`,`khong khoi dong`,`khong xam nuoc`,`khong bom nuoc`,`DW-15F8(B)-VN`],answer:`### 🔴 SỰ CỐ: KHÔNG KHỞI ĐỘNG / KHÔNG BƠM
---
* **Máy không khởi động:** Kiểm tra phích cắm, cầu dao/cầu chì; đảm bảo đã đóng chặt cửa máy.
* **Máy không bơm thoát nước:** Kiểm tra ống thoát nước có bị gấp khúc/tắc không; kiểm tra bộ lọc thô hoặc đường thoát bồn rửa.`},{id:`k68`,title:`Sự cố: Trào bọt trong khoang & Rỉ sét trên dao kéo DW-15F8(B)-VN`,keywords:[`trao bot`,`nhieu bot`,`ri set`,`vet trang`,`DW-15F8(B)-VN`],answer:`### 🔴 SỰ CỐ: TRÀO BỌT / RỈ SÉT
---
* **Bọt trào trong máy:** Do dùng sai loại chất tẩy rửa hoặc tràn nước trợ xả. Mở cửa cho bọt tan, lau nước trợ xả bị tràn, bật 1 chương trình rửa để xả sạch.
* **Rỉ sét dao kéo:** Do đồ dùng không có khả năng chống ăn mòn. Tránh rửa đồ dễ bị ăn mòn.`},{id:`k69`,title:`Sự cố: Chén đĩa rửa xong vẫn bẩn hoặc Chưa khô DW-15F8(B)-VN`,keywords:[`chen dia van ban`,`con dinh ban`,`khong kho`,`dieu chinh tro xa`,`DW-15F8(B)-VN`],answer:`### 🔴 SỰ CỐ: CHÉN ĐĨA BẨN / CHƯA KHÔ
---
* **Chén đĩa vẫn bẩn:** Do xếp đồ cản cánh phun; bộ lọc bẩn; dùng không đủ viên rửa hoặc chọn chương trình quá nhẹ.
* **Chén đĩa chưa khô:** Do lấy đồ ra quá sớm (nên chờ 15 phút); chọn chu trình rửa ngắn; hoặc do chất liệu chén đĩa thoát nước kém.`},{id:`k70`,title:`Bảng Tra cứu Mã lỗi xử lý sự cố DW-15F8(B)-VN`,keywords:[`ma loi`,`E1`,`E3`,`E4`,`E8`,`EC`,`Ed`,`DW-15F8(B)-VN`],answer:`### 🛠️ BẢNG MÃ LỖI THƯỜNG GẶP
---
* **[ E1 ] Cấp nước lâu:** Lỗi lưu lượng kế, van xả hoặc bơm (Gọi KTV).
* **[ E3 ] Nhiệt độ không đạt:** Lỗi thanh nhiệt/cảm biến. Rút phích cắm ngay (Gọi KTV).
* **[ E4 ] Tràn nước:** Lỗi phao hoặc tràn khoang chứa. Khóa van nước chính và đổ nước khay đáy trước khi thử lại (Gọi KTV).
* **[ E8 ] Lỗi van phân phối nước** / **[ EC ] Lỗi hệ thống điều khiển** / **[ Ed ] Lỗi truyền thông** (Gọi KTV sửa chữa).`},{id:`k71`,title:`Thông số Kỹ thuật & Kích thước DW-15F8(B)-VN`,keywords:[`thong so`,`kich thuoc`,`cong suat`,`muc tieu thu`,`dien nang`,`suc chua`,`DW-15F8(B)-VN`],answer:`### 📏 THÔNG SỐ KỸ THUẬT & KÍCH THƯỚC

⚡ **2. THÔNG SỐ HOẠT ĐỘNG:**

---
